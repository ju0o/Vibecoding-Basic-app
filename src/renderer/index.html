<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; font-src 'self' data: file:; object-src 'none'; base-uri 'self';">
  <title>VIBE STUDIO · Curriculum Studio</title>
  <link rel="stylesheet" href="../assets/fonts/pretendard.css">
  <link rel="stylesheet" href="./studio.css">
</head>
<body>
  <div id="app" class="studio-shell">
    <aside class="course-rail">
      <header class="brand">
        <div class="brand-mark">V</div>
        <div>
          <strong>VIBE STUDIO</strong>
          <span>CURRICULUM STUDIO</span>
        </div>
      </header>

      <button id="btn-search" class="rail-search" type="button" title="과정·회차·자료 검색 (Ctrl+K)" aria-label="과정·회차·자료 검색">
        <span class="rail-search-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="4.5"></circle><path d="M12 12l4 4"></path></svg>
        </span>
        <span class="rail-search-copy">과정, 회차, 자료 검색</span>
        <kbd>Ctrl K</kbd>
      </button>

      <div class="rail-section">
        <button class="rail-label rail-toggle active" type="button" data-rail-section="courses" aria-expanded="true">
          <span class="rail-toggle-copy">
            <span class="rail-toggle-chevron">▾</span>
            <span>COURSES</span>
          </span>
          <span id="course-count-badge" class="rail-count">00</span>
        </button>
        <div id="rail-section-courses" class="rail-section-body">
          <nav id="course-list" class="course-list" aria-label="강의 과정"></nav>
        </div>
      </div>

      <div class="rail-section rail-section-secondary">
        <button class="rail-label rail-toggle active" type="button" data-rail-section="workspace" aria-expanded="true">
          <span class="rail-toggle-copy">
            <span class="rail-toggle-chevron">▾</span>
            <span>WORKSPACE</span>
          </span>
        </button>
        <div id="rail-section-workspace" class="rail-section-body rail-tools">
          <div id="workspace-overview" class="workspace-overview"></div>
          <button id="btn-planner" class="rail-tool" type="button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"></rect><path d="M6 2v4"></path><path d="M14 2v4"></path><path d="M3 8h14"></path></svg>
            </span>
            <span><b>일정 및 메모</b><small id="planner-status">수업 운영 기록</small></span>
            <em id="planner-badge" class="tool-badge">기록</em>
          </button>
          <button id="btn-settings" class="rail-tool" type="button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.8"></circle><path d="M10 3.2v2.1"></path><path d="M10 14.7v2.1"></path><path d="M3.2 10h2.1"></path><path d="M14.7 10h2.1"></path><path d="M5.2 5.2l1.5 1.5"></path><path d="M13.3 13.3l1.5 1.5"></path><path d="M14.8 5.2l-1.5 1.5"></path><path d="M6.7 13.3l-1.5 1.5"></path></svg>
            </span>
            <span><b>화면 설정</b><small id="settings-status">표시 모드와 배율</small></span>
            <em id="settings-badge" class="tool-badge">기본</em>
          </button>
        </div>
      </div>

      <footer class="rail-footer">
        <div>
          <span class="status-dot"></span>
          <span>OFFLINE READY</span>
        </div>
        <strong>3.0.0 BETA 3</strong>
      </footer>
    </aside>

    <section class="lesson-pane">
      <header class="pane-header">
        <div>
          <span id="course-kicker" class="kicker"></span>
          <h1 id="course-title">과정 불러오는 중</h1>
          <p id="course-route"></p>
        </div>
      </header>

      <div id="course-tabs" class="course-tabs" role="tablist">
        <button type="button" class="active" data-tab="lessons">강의</button>
        <button type="button" data-tab="library">자료실</button>
      </div>

      <div id="list-summary" class="list-summary"></div>
      <div id="list-view-tabs" class="list-view-tabs" aria-hidden="true"></div>
      <div id="list-db-toolbar" class="list-db-toolbar" aria-hidden="true"></div>
      <div id="list-columns" class="list-columns" aria-hidden="true"></div>
      <div id="db-popover" class="db-popover hidden" aria-hidden="true"></div>
      <div id="lesson-list" class="lesson-list"></div>
    </section>

    <main class="detail-pane">
      <header class="detail-topbar">
        <div class="breadcrumb">
          <span id="detail-course-code">VIBE</span>
          <i></i>
          <span id="detail-position">LESSON</span>
        </div>
        <div id="topbar-context" class="topbar-context"></div>
        <div class="topbar-actions">
          <button id="btn-quick-search" class="topbar-button compact" type="button"><span>검색</span><kbd>Ctrl K</kbd></button>
          <button id="btn-fullscreen" class="icon-button" type="button" title="전체화면 (Ctrl+F)" aria-label="전체화면">⛶</button>
        </div>
      </header>

      <article id="detail-content" class="detail-content"></article>
    </main>
  </div>

  <section id="player" class="player hidden" aria-label="강의 플레이어">
    <header class="player-bar">
      <button id="btn-player-close" class="player-back" type="button">‹ <span>스튜디오</span></button>
      <div class="player-heading">
        <span id="player-course"></span>
        <strong id="player-title"></strong>
      </div>
      <div class="player-tools">
        <button id="btn-notes" class="icon-button" type="button" title="발표자 메모">▤</button>
        <button id="btn-board" class="icon-button" type="button" title="화면 판서">✎</button>
        <button id="btn-print" class="icon-button" type="button" title="인쇄">⎙</button>
        <button id="btn-pdf" class="icon-button" type="button" title="PDF 저장">⇩</button>
        <button id="btn-complete" class="complete-button" type="button">미완료</button>
        <button id="btn-player-fullscreen" class="icon-button" type="button" title="전체화면">⛶</button>
      </div>
    </header>
    <div class="player-body">
      <div class="webview-wrap">
        <div id="player-loading" class="player-loading"><i></i><span>자료를 준비하고 있습니다.</span></div>
        <webview id="lecture-webview" class="lecture-webview"></webview>
      </div>
      <aside id="notes-panel" class="notes-panel">
        <header>
          <div class="notes-heading">
            <span class="notes-kicker">SAY · DO · ASK</span>
            <strong>발표자 메모</strong>
          </div>
          <button id="btn-notes-close" type="button">×</button>
        </header>
        <textarea id="notes-input" placeholder="이 회차에서 강조할 말, 질문, 현장 변수를 기록하세요."></textarea>
        <small>핵심 멘트, 시연 순서, 학생 질문을 짧게 나눠 적으면 발표 흐름을 유지하기 쉽습니다.</small>
      </aside>
    </div>
    <footer class="player-footer">
      <button id="btn-prev" type="button">‹ 이전</button>
      <div><span id="player-duration"></span><i></i><span id="player-counter"></span></div>
      <button id="btn-next" type="button">다음 ›</button>
    </footer>
  </section>

  <aside id="utility-drawer" class="utility-drawer" aria-hidden="true">
    <header>
      <div><span class="kicker" id="drawer-kicker">OPERATIONS</span><h2 id="drawer-title">일정 및 메모</h2></div>
      <button id="btn-drawer-close" type="button" aria-label="닫기">×</button>
    </header>
    <div id="drawer-content" class="drawer-content"></div>
  </aside>
  <div id="drawer-shade" class="drawer-shade"></div>

  <div id="command-palette" class="command-palette hidden" role="dialog" aria-modal="true" aria-label="빠른 검색">
    <div class="command-box">
      <header>
        <span>⌕</span>
        <input id="command-input" type="text" placeholder="과정, 회차, 자료 검색" autocomplete="off">
        <kbd>ESC</kbd>
      </header>
      <div id="command-results" class="command-results"></div>
      <footer><span>↑ ↓ 이동</span><span>Enter 열기</span><span>Ctrl K 검색</span></footer>
    </div>
  </div>

  <canvas id="board-canvas" class="board-canvas"></canvas>
  <div id="board-toolbar" class="board-toolbar hidden">
    <button type="button" class="swatch active" data-color="#ff5f72" style="--swatch:#ff5f72" aria-label="빨간색"></button>
    <button type="button" class="swatch" data-color="#40d9ff" style="--swatch:#40d9ff" aria-label="파란색"></button>
    <button type="button" class="swatch" data-color="#ffd166" style="--swatch:#ffd166" aria-label="노란색"></button>
    <i></i>
    <button type="button" data-size="4" class="stroke active">얇게</button>
    <button type="button" data-size="10" class="stroke">두껍게</button>
    <button id="btn-board-clear" type="button">지우기</button>
    <button id="btn-board-close" type="button">×</button>
  </div>

  <script src="./studio.js"></script>
</body>
</html>
