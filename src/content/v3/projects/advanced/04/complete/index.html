<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 심화 통합 S4 - Complete</title>
<style>:root{color-scheme:dark;--bg:#080c14;--panel:#101722;--line:#253241;--teal:#2dd4bf;--amber:#f59e0b;--red:#fb7185;--text:#edf7f5;--muted:#8da2ad;font-family:Pretendard,"Malgun Gothic",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);letter-spacing:0}
    header{display:flex;justify-content:space-between;align-items:center;padding:24px 6vw;border-bottom:1px solid var(--line)}header b{font-size:15px}
    main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.9fr);gap:24px;padding:6vh 6vw}
    section,aside{border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25)}section{padding:40px}aside{padding:24px}
    small{font:850 11px Consolas,monospace}h1{margin:16px 0;font-size:clamp(32px,4.4vw,60px);line-height:1.05}p{color:var(--muted);font-size:17px;line-height:1.6}
    table{width:100%;margin-top:22px;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:14px}th,td{padding:14px;border-bottom:1px solid var(--line);background:#101722;text-align:left;vertical-align:top}th{color:#bfece6;font:850 11px Consolas,monospace}td{color:#dce7e5;font-size:13px;line-height:1.45}tr:last-child td{border-bottom:0}.ok{color:var(--teal);font-weight:850}.warn{color:var(--amber);font-weight:850}
    .matrix{display:grid;gap:12px;margin-top:26px}.row{display:grid;grid-template-columns:1.2fr .9fr .9fr 1fr;gap:1px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--line)}.row>*{padding:14px;background:var(--panel)}.row.head>*{color:#cde8e3;font:850 11px Consolas,monospace}.row b{display:block;font-size:14px}.row span{display:block;margin-top:7px;color:var(--muted);font-size:12px}
    .cards{display:grid;gap:12px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#0c1320}.card h2{margin:0;font-size:18px}.card p{margin:7px 0 0;font-size:13px}
    .terminal{margin-top:24px;padding:20px;border:1px solid rgba(251,113,133,.35);border-radius:14px;background:#090d13;color:#dbe7e5;font:750 13px Consolas,monospace;line-height:1.7}.terminal b{color:var(--red)}
    .evi{display:grid;gap:12px}.evi div,.evi article{padding:15px;border:1px solid var(--line);border-radius:14px;background:#0d1420}.evi b{display:block;font-size:14px}.evi span{display:block;margin-top:7px;color:var(--muted);font-size:12px}.bad{border-color:rgba(251,113,133,.5)!important}.bad b{color:var(--red)}.evi article:first-child{border-color:rgba(45,212,191,.45)}
    .badge{display:inline-flex;margin-top:16px;padding:9px 12px;border-radius:999px;color:#07110f;background:var(--teal);font:900 11px Consolas,monospace}
    button{min-height:44px;margin-top:20px;padding:0 18px;border:0;border-radius:11px;font-weight:900;cursor:pointer}
  body{background:radial-gradient(circle at 74% 16%,rgba(45,212,191,.16),transparent 30%),var(--bg)}
  header span{color:var(--teal);font:850 11px Consolas,monospace}section,aside{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02))}small{color:var(--teal)}
</style></head>
<body data-variant="complete">
  <header><b>VIBE STUDIO · ADVANCED S4</b><span>COMPLETE · LEAST PRIVILEGE</span></header>
  <main>
    <section>
      <small>완성 상태</small>
      <h1>필요한 만큼만 연결하고 승인·감사를 두 도구에 맞췄습니다</h1>
      <p>권한이 좁아지고 민감 작업에 승인 게이트와 감사 로그가 남습니다.</p>
      <table>
        <thead><tr><th>연결</th><th>범위</th><th>읽기/쓰기</th><th>승인/감사</th></tr></thead>
        <tbody>
          <tr><td>파일 서버</td><td class="">지정 폴더만</td><td>읽기 전용</td><td class="ok">범위 검증</td></tr>
          <tr><td>배포 API</td><td class="warn">스테이징</td><td>쓰기 시 승인</td><td class="ok">승인 게이트</td></tr>
          <tr><td>외부 페이지</td><td class="">불신 입력</td><td>읽기만</td><td class="ok">검증 후 사용</td></tr>
        </tbody>
      </table>
      <span class="badge">READY FOR REVIEW</span>
    </section>
    <aside>
      <div class="evi">
        <article><b>최소 권한</b><span>읽기/쓰기 범위를 필요한 만큼만.</span></article>
        <article><b>승인·감사</b><span>민감 작업에 게이트와 로그.</span></article>
        <article><b>인젝션 방어</b><span>외부 입력을 검증 후에만 사용.</span></article>
      </div>
    </aside>
  </main>
</body></html>
