<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">웹 요청 흐름 설명 구조</title>
  <desc id="desc">한 문장 뼈대에서 시작해 요청과 응답을 분리하고 status를 class로 요약하며 sub-resource 요청까지 포함하는 설명 순서</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0d9488" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#042f2e" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="420" rx="28" fill="#f0fdfa" />
  <text x="480" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#115e59">큰 그림 → 세부 → sub-resource 순서로 설명한다</text>

  <g filter="url(#shadow)">
    <rect x="230" y="88" width="500" height="66" rx="16" fill="#ccfbf1" stroke="#5eead4" stroke-width="2" />
    <text x="480" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#115e59">뼈대 한 문장</text>
    <text x="480" y="142" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">"client가 request를 보내고 server가 response를 준다"</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="196" width="360" height="96" rx="16" fill="#99f6e4" stroke="#2dd4bf" stroke-width="2" />
    <text x="260" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#115e59">요청 (Request)</text>
    <text x="260" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0f766e">method · path</text>
    <text x="260" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0f766e">headers · body</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="196" width="360" height="96" rx="16" fill="#a5f3fc" stroke="#22d3ee" stroke-width="2" />
    <text x="700" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#155e75">응답 (Response)</text>
    <text x="700" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0e7490">status class (4xx=요청 · 5xx=서버)</text>
    <text x="700" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0e7490">headers · body</text>
  </g>

  <path d="M420 154 L260 154 L260 194" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M540 154 L700 154 L700 194" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="230" y="330" width="500" height="66" rx="16" fill="#d9f99d" stroke="#84cc16" stroke-width="2" />
    <text x="480" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#3f6212">sub-resource 요청까지 포함</text>
    <text x="480" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4d7c0f">HTML 요청 → 파싱 → CSS·JS·이미지 추가 요청</text>
  </g>
  <path d="M260 292 L260 363 L228 363" fill="none" stroke="#84cc16" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M700 292 L700 363 L732 363" fill="none" stroke="#84cc16" stroke-width="2.5" marker-end="url(#arrow)" />
</svg>
