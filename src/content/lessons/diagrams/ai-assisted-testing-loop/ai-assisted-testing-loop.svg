<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">AI 보조 테스트 루프</title>
  <desc id="desc">변경 위험을 scenario로 나누고 AI test draft, 사람 검토, test run, failure feedback, regression으로 이어지는 테스트 루프</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4f46e5" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#312e81" flood-opacity="0.13" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="#eef2ff" />
  <text x="480" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#312e81">AI 테스트 초안은 실행 결과와 feedback으로 완성됩니다</text>
  <g filter="url(#shadow)">
    <rect x="50" y="118" width="172" height="116" rx="18" fill="#fff" stroke="#818cf8" stroke-width="2" />
    <text x="136" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#3730a3">Risk</text>
    <text x="136" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">changed behavior</text>
    <text x="136" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">edge case</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="268" y="118" width="172" height="116" rx="18" fill="#fff" stroke="#818cf8" stroke-width="2" />
    <text x="354" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#3730a3">Test Matrix</text>
    <text x="354" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">scenario</text>
    <text x="354" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">expected result</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="486" y="118" width="172" height="116" rx="18" fill="#fff" stroke="#818cf8" stroke-width="2" />
    <text x="572" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#3730a3">AI Draft</text>
    <text x="572" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">Vitest</text>
    <text x="572" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">Playwright</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="704" y="118" width="206" height="116" rx="18" fill="#fff" stroke="#818cf8" stroke-width="2" />
    <text x="807" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#3730a3">Human Review</text>
    <text x="807" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">user-like behavior</text>
    <text x="807" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">no flaky wait</text>
  </g>
  <path d="M222 176 H260" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M440 176 H478" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M658 176 H696" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="130" y="296" width="700" height="78" rx="18" fill="#fff" stroke="#c7d2fe" stroke-width="2" />
  <text x="480" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#3730a3">실행 결과는 다음 prompt의 feedback이 됩니다</text>
  <text x="480" y="354" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4f46e5">vitest run / Playwright failure → code 또는 test 수정 → regression 고정</text>
</svg>
