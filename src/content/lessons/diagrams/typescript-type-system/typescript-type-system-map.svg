<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript Type System Map</title>
  <desc id="desc">TypeScript map showing annotations, inference, object types, union types, narrowing, generics, and any as type-checking escape.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .core { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .shape { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .flow { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
    .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
    .label { font: 700 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
    .small { font: 500 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="640"/>
  <rect class="panel" x="48" y="38" width="904" height="564" rx="24"/>
  <text class="title" x="82" y="82">TypeScript는 shape와 behavior를 실행 전에 검토한다</text>

  <rect class="core" x="374" y="124" width="252" height="110" rx="18"/>
  <text class="label" x="424" y="160">Static Type Checker</text>
  <text class="small" x="410" y="190">predicts expected behavior</text>
  <text class="small" x="420" y="214">before JavaScript runs</text>

  <rect class="shape" x="90" y="304" width="210" height="92" rx="18"/>
  <text class="label" x="138" y="338">Object Type</text>
  <text class="mono" x="120" y="368">{ title: string }</text>

  <rect class="flow" x="318" y="304" width="210" height="92" rx="18"/>
  <text class="label" x="370" y="338">Union Type</text>
  <text class="mono" x="354" y="368">ok | error</text>

  <rect class="flow" x="546" y="304" width="210" height="92" rx="18"/>
  <text class="label" x="594" y="338">Narrowing</text>
  <text class="small" x="578" y="368">control flow refines type</text>

  <rect class="shape" x="774" y="304" width="140" height="92" rx="18"/>
  <text class="label" x="806" y="338">Generic</text>
  <text class="mono" x="812" y="368">Result&lt;T&gt;</text>

  <rect class="warn" x="388" y="476" width="224" height="78" rx="18"/>
  <text class="label" x="470" y="508">any</text>
  <text class="small" x="424" y="534">removes useful checks</text>

  <path class="arrow" d="M450 234 L220 304"/>
  <path class="arrow" d="M492 234 L430 304"/>
  <path class="arrow" d="M540 234 L650 304"/>
  <path class="arrow" d="M588 234 L832 304"/>
  <path class="arrow" d="M500 234 V476"/>
</svg>
