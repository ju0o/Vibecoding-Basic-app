<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Git 복구 분기 지도</title>
  <desc id="desc">잃은 것의 종류를 분류해 작업 파일은 restore, 공유 커밋은 revert, 사라진 참조는 reflog, 미추적 파일은 clean dry-run으로 분기하는 플레이북</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b45309" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#451a03" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="#fffbeb" />
  <text x="480" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#92400e">명령보다 먼저: 무엇을 잃었는가?</text>

  <g filter="url(#shadow)">
    <rect x="330" y="70" width="300" height="62" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <text x="480" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#92400e">사고 발생 — 잃은 것을 분류</text>
    <text x="480" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#b45309">서두르지 말고 한 문장으로 쓴다</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="190" width="205" height="130" rx="16" fill="#fde68a" stroke="#f59e0b" stroke-width="2" />
    <text x="142" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#92400e">커밋 전 수정</text>
    <text x="142" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#78350f">git restore</text>
    <text x="142" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b45309">작업 트리 파일 복원</text>
    <text x="142" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b45309">(수정은 버려짐 — 확인 후)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="265" y="190" width="205" height="130" rx="16" fill="#fcd34d" stroke="#d97706" stroke-width="2" />
    <text x="367" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#78350f">push된 커밋</text>
    <text x="367" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#78350f">git revert</text>
    <text x="367" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#92400e">이력 보존 — 반대 커밋</text>
    <text x="367" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#92400e">공유 브랜치의 안전 경로</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="490" y="190" width="205" height="130" rx="16" fill="#fde68a" stroke="#f59e0b" stroke-width="2" />
    <text x="592" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#92400e">사라진 커밋/브랜치</text>
    <text x="592" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#78350f">git reflog</text>
    <text x="592" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b45309">참조 이동 기록에서</text>
    <text x="592" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b45309">해시를 되찾는다</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="715" y="190" width="205" height="130" rx="16" fill="#fecaca" stroke="#f87171" stroke-width="2" />
    <text x="817" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#991b1b">미추적 파일 정리</text>
    <text x="817" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7f1d1d">git clean -n</text>
    <text x="817" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b91c1c">dry-run 먼저 — 지워지면</text>
    <text x="817" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b91c1c">Git도 복구 못 한다</text>
  </g>

  <path d="M400 132 L142 132 L142 186" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M440 132 L367 132 L367 186" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M520 132 L592 132 L592 186" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M560 132 L817 132 L817 186" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />

  <text x="480" y="386" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">파괴적 명령(reset --hard, clean) 전에는 백업 브랜치/stash로 스냅샷을 남긴다</text>
</svg>
