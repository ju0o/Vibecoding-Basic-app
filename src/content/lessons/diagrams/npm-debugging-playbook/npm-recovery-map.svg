<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">npm 디버깅 분기 지도</title>
  <desc id="desc">깨진 층을 분류해 manifest는 JSON 검사, 재현성은 npm ci, 오염 환경은 동결 재설치, 취약점은 audit로 분기하는 플레이북</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b91c1c" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#450a0a" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="#fef2f2" />
  <text x="480" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#991b1b">재설치 주문보다 먼저: 어느 층이 깨졌는가?</text>

  <g filter="url(#shadow)">
    <rect x="330" y="70" width="300" height="62" rx="16" fill="#fee2e2" stroke="#f87171" stroke-width="2" />
    <text x="480" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#991b1b">npm 오류 — 층을 분류</text>
    <text x="480" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#b91c1c">오류 첫 줄이 대개 층을 알려준다</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="190" width="205" height="130" rx="16" fill="#fecaca" stroke="#f87171" stroke-width="2" />
    <text x="142" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#991b1b">설치가 시작도 안 됨</text>
    <text x="142" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#7f1d1d">package.json 검사</text>
    <text x="142" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b91c1c">"It must be actual JSON"</text>
    <text x="142" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b91c1c">주석·후행 콤마 금지</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="265" y="190" width="205" height="130" rx="16" fill="#fca5a5" stroke="#ef4444" stroke-width="2" />
    <text x="367" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#7f1d1d">내 컴퓨터에서만 됨</text>
    <text x="367" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7f1d1d">npm ci</text>
    <text x="367" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#991b1b">lockfile이 진실 —</text>
    <text x="367" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#991b1b">동결(frozen) 재현 설치</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="490" y="190" width="205" height="130" rx="16" fill="#fecaca" stroke="#f87171" stroke-width="2" />
    <text x="592" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#991b1b">환경이 오염됨</text>
    <text x="592" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7f1d1d">npm ci (재설치)</text>
    <text x="592" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b91c1c">node_modules 제거 후</text>
    <text x="592" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#b91c1c">깨끗한 상태로 복귀</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="715" y="190" width="205" height="130" rx="16" fill="#fed7aa" stroke="#fb923c" stroke-width="2" />
    <text x="817" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#9a3412">보안 경고</text>
    <text x="817" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7c2d12">npm audit</text>
    <text x="817" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#c2410c">fix는 버전 이동 동반 —</text>
    <text x="817" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#c2410c">diff 확인 + verify 후 커밋</text>
  </g>

  <path d="M400 132 L142 132 L142 186" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M440 132 L367 132 L367 186" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M520 132 L592 132 L592 186" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M560 132 L817 132 L817 186" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)" />

  <text x="480" y="386" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#991b1b">manifest(의도) · lockfile(고정 기록) · node_modules(실체) — 사고는 대부분 세 층의 불일치</text>
</svg>
