<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="CI/CD 흐름: 커밋 이벤트가 워크플로를 트리거하고 검증 잡의 스텝들이 실행되며, 통과해야만 배포 잡이 실행된다">
  <style>
    .lb { font: 600 13px sans-serif; fill: #334155; }
    .event { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
    .ci { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .step { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.2; }
    .cd { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
    .fail { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.2; }
    .cm { font: 600 11px monospace; fill: #0f172a; }
    .sub { font: 11px sans-serif; fill: #64748b; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .gate { stroke: #0f766e; stroke-width: 2; fill: none; marker-end: url(#g); }
    @media (prefers-color-scheme: dark) {
      .lb { fill: #e2e8f0; } .cm { fill: #f1f5f9; } .sub { fill: #94a3b8; }
      .event { fill: #1e293b; stroke: #94a3b8; } .ci { fill: #172554; stroke: #93c5fd; }
      .step { fill: #134e4a; stroke: #5eead4; } .cd { fill: #2e1065; stroke: #c4b5fd; } .fail { fill: #450a0a; stroke: #fca5a5; } .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/></marker>
  </defs>

  <rect class="event" x="20" y="130" width="120" height="50" rx="10"/>
  <text class="cm" x="80" y="152" text-anchor="middle">커밋 / PR</text>
  <text class="sub" x="80" y="170" text-anchor="middle">= 이벤트</text>
  <path class="edge" d="M140 155 L 176 155"/>
  <text class="sub" x="158" y="145" text-anchor="middle">트리거</text>

  <!-- CI job -->
  <rect class="ci" x="180" y="70" width="250" height="170" rx="10"/>
  <text class="lb" x="305" y="94" text-anchor="middle">잡: 검증 (CI)</text>
  <rect class="step" x="200" y="106" width="210" height="28" rx="6"/><text class="cm" x="305" y="125" text-anchor="middle">npm ci</text>
  <rect class="step" x="200" y="142" width="210" height="28" rx="6"/><text class="cm" x="305" y="161" text-anchor="middle">npm run verify</text>
  <rect class="step" x="200" y="178" width="210" height="28" rx="6"/><text class="cm" x="305" y="197" text-anchor="middle">npm run build</text>
  <text class="sub" x="305" y="226" text-anchor="middle">스텝: 순서대로 · 실패 시 중단</text>

  <!-- gate to CD -->
  <path class="gate" d="M430 130 L 496 130"/>
  <text class="sub" x="463" y="120" text-anchor="middle">통과 시만</text>
  <rect class="cd" x="500" y="100" width="190" height="60" rx="10"/>
  <text class="lb" x="595" y="126" text-anchor="middle">잡: 배포 (CD)</text>
  <text class="sub" x="595" y="146" text-anchor="middle">배포 플랫폼으로 전송</text>

  <!-- fail path -->
  <path class="edge" d="M430 195 L 496 210" stroke="#b91c1c"/>
  <rect class="fail" x="500" y="190" width="190" height="46" rx="10"/>
  <text class="sub" x="595" y="212" text-anchor="middle">검증 실패 → 배포 안 됨</text>
  <text class="sub" x="595" y="228" text-anchor="middle">(깨진 코드 차단)</text>

  <text class="sub" x="360" y="285" text-anchor="middle">이벤트 → 워크플로 → 잡 → 스텝 · 러너(정해진 서버)에서 일관 실행</text>
  <text class="sub" x="360" y="308" text-anchor="middle">CI=안전한가 묻기 · CD=그럼 내보내기 · 검증 없는 배포는 구조적으로 불가</text>
</svg>
