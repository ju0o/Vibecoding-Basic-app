<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">운영 환경과 secret 흐름</title>
  <desc id="desc">환경변수와 secret이 repository 밖에서 CI, preview, production으로 주입되고 public prefix는 브라우저 bundle로 노출되는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e" />
    </marker>
    <style>
      .safe { fill: #ecfdf5; stroke: #0f766e; stroke-width: 2; rx: 18; }
      .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 18; }
      .code { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .text { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .line { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#arrow); }
      .danger { fill: none; stroke: #ea580c; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="48" y="72" width="190" height="92" class="code" />
  <text x="143" y="108" text-anchor="middle" class="text">Repository</text>
  <text x="143" y="135" text-anchor="middle" class="sub">code without secrets</text>
  <rect x="302" y="72" width="190" height="92" class="safe" />
  <text x="397" y="108" text-anchor="middle" class="text">Secret Store</text>
  <text x="397" y="135" text-anchor="middle" class="sub">env vars by scope</text>
  <rect x="556" y="72" width="190" height="92" class="safe" />
  <text x="651" y="108" text-anchor="middle" class="text">CI/CD</text>
  <text x="651" y="135" text-anchor="middle" class="sub">secrets context</text>
  <rect x="184" y="266" width="190" height="92" class="safe" />
  <text x="279" y="302" text-anchor="middle" class="text">Preview</text>
  <text x="279" y="329" text-anchor="middle" class="sub">test resources</text>
  <rect x="438" y="266" width="190" height="92" class="safe" />
  <text x="533" y="302" text-anchor="middle" class="text">Production</text>
  <text x="533" y="329" text-anchor="middle" class="sub">real users</text>
  <rect x="690" y="266" width="190" height="92" class="warn" />
  <text x="785" y="302" text-anchor="middle" class="text">Browser Bundle</text>
  <text x="785" y="329" text-anchor="middle" class="sub">public values only</text>
  <path d="M238 118 H302" class="line" />
  <path d="M492 118 H556" class="line" />
  <path d="M611 164 C550 210 500 236 533 266" class="line" />
  <path d="M651 164 C532 208 314 238 279 266" class="line" />
  <path d="M628 312 H690" class="danger" />
  <text x="785" y="228" text-anchor="middle" class="sub">NEXT_PUBLIC_ only</text>
  <text x="460" y="422" text-anchor="middle" class="sub">secret은 코드 밖에서 주입하고, public prefix는 공개 가능한 값에만 사용한다</text>
</svg>
