<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">배포 체크리스트 6단</title>
  <desc id="desc">빌드 검증, 보안 점검, 환경 변수, 접근 보호, 배포 실행, 배포 후 확인의 여섯 단계 점검표와 실패 시 되돌아갈 경로</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#15803d" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#052e16" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="#f0fdf4" />
  <text x="480" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#166534">배포는 명령 한 번이 아니라 점검의 묶음이다</text>

  <g filter="url(#shadow)">
    <rect x="48" y="80" width="272" height="92" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2" />
    <text x="184" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#166534">1. 빌드 검증</text>
    <text x="184" y="138" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#15803d">npm run verify 녹색인가</text>
    <text x="184" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#16a34a">실패 → npm 플레이북</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="344" y="80" width="272" height="92" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2" />
    <text x="480" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#166534">2. 보안 점검</text>
    <text x="480" y="138" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#15803d">공개 표면 확인 — 라우트는</text>
    <text x="480" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#15803d">공개 엔드포인트, 액션 내부 인증</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="640" y="80" width="272" height="92" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2" />
    <text x="776" y="112" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#166534">3. 환경 변수</text>
    <text x="776" y="138" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#15803d">코드 밖 설정이 배포 환경에</text>
    <text x="776" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#15803d">준비됐는가 (해시 주입 등)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="48" y="212" width="272" height="92" rx="14" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <text x="184" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#14532d">4. 접근 보호</text>
    <text x="184" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#166534">게이트·noindex가 이번</text>
    <text x="184" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#166534">배포에서도 유지되는가</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="344" y="212" width="272" height="92" rx="14" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <text x="480" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#14532d">5. 배포 실행</text>
    <text x="480" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#166534">대상 프로젝트 확인 —</text>
    <text x="480" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#166534">토큰은 환경 변수로</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="640" y="212" width="272" height="92" rx="14" fill="#bbf7d0" stroke="#22c55e" stroke-width="2" />
    <text x="776" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#14532d">6. 배포 후 확인</text>
    <text x="776" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#166534">URL 열기 · 게이트 · 신규 콘텐츠</text>
    <text x="776" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#16a34a">문제 발견 → 롤백 먼저</text>
  </g>

  <line x1="320" y1="126" x2="340" y2="126" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="616" y1="126" x2="636" y2="126" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M776 172 L776 188 L184 188 L184 208" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="320" y1="258" x2="340" y2="258" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="616" y1="258" x2="636" y2="258" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow)" />

  <text x="480" y="368" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">이 사이트의 실제 절차: verify exit 0 → 게이트 확인 → firebase deploy --project 지정 → 라이브 URL 확인</text>
  <text x="480" y="396" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#16a34a">위험 낮은 배포는 짧은 경로(1→5→6) 허용 — 단, 각 단은 관찰 가능한 증거로 답한다</text>
</svg>
