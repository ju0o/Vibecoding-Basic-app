<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">AI 챗봇 시스템 루프</title>
  <desc id="desc">사용자 메시지, 대화 상태, retrieval, 모델, tool boundary, 답변이 연결되는 챗봇 시스템 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#db2777" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#831843" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="450" rx="28" fill="#fdf2f8" />
  <text x="480" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#831843">챗봇은 state와 retrieval, tool 경계를 조립해 답합니다</text>
  <g filter="url(#shadow)">
    <rect x="52" y="128" width="154" height="106" rx="18" fill="#ffffff" stroke="#f9a8d4" stroke-width="2" />
    <text x="129" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#be185d">Message</text>
    <text x="129" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#db2777">user turn</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="248" y="128" width="168" height="106" rx="18" fill="#ffffff" stroke="#f9a8d4" stroke-width="2" />
    <text x="332" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#be185d">State</text>
    <text x="332" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#db2777">recent turns</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="458" y="128" width="168" height="106" rx="18" fill="#ffffff" stroke="#f9a8d4" stroke-width="2" />
    <text x="542" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#be185d">Retrieval</text>
    <text x="542" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#db2777">semantic search</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="668" y="128" width="118" height="106" rx="18" fill="#ffffff" stroke="#f9a8d4" stroke-width="2" />
    <text x="727" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#be185d">Model</text>
    <text x="727" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#db2777">answer/tool</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="626" y="294" width="220" height="84" rx="18" fill="#ffffff" stroke="#f9a8d4" stroke-width="2" />
    <text x="736" y="326" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#be185d">Tool Boundary</text>
    <text x="736" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#db2777">validate before execution</text>
  </g>
  <path d="M206 181 H240" stroke="#db2777" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M416 181 H450" stroke="#db2777" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M626 181 H660" stroke="#db2777" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M727 234 V286" stroke="#db2777" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M626 336 H154 V242" fill="none" stroke="#db2777" stroke-width="4" marker-end="url(#arrow)" />
  <text x="480" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#9d174d">stateless request를 state window와 retrieval context로 보강합니다</text>
</svg>
