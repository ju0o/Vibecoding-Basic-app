<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">AI 개발 도구 시대 지도</title>
  <desc id="desc">IntelliSense, AI autocomplete, chat coding, agent 시대가 위임 범위와 검증 강도에 따라 확장되는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed" />
    </marker>
    <style>
      .era { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 18; }
      .verify { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 18; }
      .text { font-family: Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .line { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="44" y="82" width="170" height="88" class="era" />
  <text x="129" y="116" text-anchor="middle" class="text">IntelliSense</text>
  <text x="129" y="142" text-anchor="middle" class="sub">completion, quick info</text>
  <rect x="270" y="82" width="170" height="88" class="era" />
  <text x="355" y="116" text-anchor="middle" class="text">AI Autocomplete</text>
  <text x="355" y="142" text-anchor="middle" class="sub">lines and functions</text>
  <rect x="496" y="82" width="170" height="88" class="era" />
  <text x="581" y="116" text-anchor="middle" class="text">Chat Coding</text>
  <text x="581" y="142" text-anchor="middle" class="sub">questions, debugging</text>
  <rect x="722" y="82" width="170" height="88" class="era" />
  <text x="807" y="116" text-anchor="middle" class="text">Agent</text>
  <text x="807" y="142" text-anchor="middle" class="sub">plan, edit, verify</text>
  <path d="M214 126 H270" class="line" />
  <path d="M440 126 H496" class="line" />
  <path d="M666 126 H722" class="line" />
  <rect x="72" y="270" width="190" height="86" class="verify" />
  <text x="167" y="304" text-anchor="middle" class="text">Diff Read</text>
  <text x="167" y="330" text-anchor="middle" class="sub">small suggestion check</text>
  <rect x="366" y="270" width="190" height="86" class="verify" />
  <text x="461" y="304" text-anchor="middle" class="text">Source & Test</text>
  <text x="461" y="330" text-anchor="middle" class="sub">chat answer validation</text>
  <rect x="660" y="270" width="190" height="86" class="verify" />
  <text x="755" y="304" text-anchor="middle" class="text">CI Review</text>
  <text x="755" y="330" text-anchor="middle" class="sub">agent change gate</text>
  <path d="M355 170 C292 218 216 242 167 270" class="line" />
  <path d="M581 170 C534 218 496 242 461 270" class="line" />
  <path d="M807 170 C790 218 772 242 755 270" class="line" />
  <text x="460" y="420" text-anchor="middle" class="sub">위임 범위가 커질수록 검증도 diff 읽기에서 CI와 review로 확장된다</text>
</svg>
