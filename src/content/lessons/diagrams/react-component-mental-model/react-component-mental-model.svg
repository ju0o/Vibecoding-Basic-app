<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">React Component Mental Model</title>
  <desc id="desc">React component model showing parent props, child components, composition, pure render, and commit to DOM.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .parent { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .child { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .render { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .dom { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
    .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
    .label { font: 700 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
    .small { font: 500 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="640"/>
  <rect class="panel" x="48" y="38" width="904" height="564" rx="24"/>
  <text class="title" x="82" y="82">React component는 input(props)으로 UI description을 계산한다</text>

  <rect class="parent" x="92" y="150" width="240" height="120" rx="18"/>
  <text class="label" x="162" y="184">Parent</text>
  <text class="mono" x="124" y="216">&lt;LessonCard title=... /&gt;</text>
  <text class="small" x="130" y="244">passes information</text>

  <rect class="child" x="414" y="128" width="250" height="164" rx="18"/>
  <text class="label" x="478" y="164">Component</text>
  <text class="mono" x="450" y="196">function LessonCard(props)</text>
  <text class="small" x="456" y="226">regular JavaScript function</text>
  <text class="small" x="456" y="252">same inputs → same JSX</text>

  <rect class="render" x="728" y="150" width="190" height="120" rx="18"/>
  <text class="label" x="788" y="184">JSX</text>
  <text class="mono" x="760" y="216">&lt;article&gt;...&lt;/article&gt;</text>
  <text class="small" x="770" y="244">UI description</text>

  <path class="arrow" d="M332 210 H414"/>
  <text class="small" x="350" y="196">props</text>
  <path class="arrow" d="M664 210 H728"/>
  <text class="small" x="676" y="196">render</text>

  <rect class="child" x="132" y="396" width="190" height="86" rx="18"/>
  <text class="label" x="176" y="428">Child A</text>
  <text class="small" x="166" y="456">composition</text>

  <rect class="child" x="404" y="396" width="190" height="86" rx="18"/>
  <text class="label" x="448" y="428">Child B</text>
  <text class="small" x="438" y="456">props contract</text>

  <rect class="dom" x="676" y="396" width="210" height="86" rx="18"/>
  <text class="label" x="746" y="428">DOM</text>
  <text class="small" x="714" y="456">commit update to screen</text>

  <path class="arrow" d="M540 292 C540 344 228 344 228 396"/>
  <path class="arrow" d="M540 292 V396"/>
  <path class="arrow" d="M823 270 V396"/>
</svg>
