<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">package.json and Semantic Versioning review flow</title>
  <desc id="desc">A flow from project folder tree to package.json fields, scripts, dependencies, version ranges, SemVer risk, and verify results.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef6ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="420" rx="24" fill="url(#panel)" />
  <text x="52" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">package.json + SemVer 검토 흐름</text>
  <text x="52" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475569">AI가 dependency나 scripts를 바꿨을 때 package metadata에서 verify 결과까지 추적한다.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="150" height="100" rx="16" fill="#ffffff" stroke="#bfdbfe" />
    <text x="129" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Folder Tree</text>
    <text x="129" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">package scope</text>
    <text x="129" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">project root</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="132" width="160" height="100" rx="16" fill="#ffffff" stroke="#bfdbfe" />
    <text x="330" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">package.json</text>
    <text x="330" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">name / version</text>
    <text x="330" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">scripts / dependencies</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="456" y="104" width="170" height="92" rx="16" fill="#ffffff" stroke="#bbf7d0" />
    <text x="541" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">scripts</text>
    <text x="541" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">npm run build</text>
    <text x="541" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">actual command</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="456" y="224" width="170" height="96" rx="16" fill="#ffffff" stroke="#fed7aa" />
    <text x="541" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a3412">dependencies</text>
    <text x="541" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">package name</text>
    <text x="541" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">version range</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="224" width="150" height="96" rx="16" fill="#ffffff" stroke="#ddd6fe" />
    <text x="765" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">SemVer</text>
    <text x="765" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">MAJOR.MINOR.PATCH</text>
    <text x="765" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">risk signal</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="884" y="164" width="120" height="104" rx="16" fill="#ffffff" stroke="#fecaca" />
    <text x="944" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Verify</text>
    <text x="944" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">lint / typecheck</text>
    <text x="944" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">test / build</text>
  </g>

  <path d="M204 182 H246" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M410 162 H452" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M410 202 C430 202 430 272 452 272" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M626 272 H686" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M840 272 C864 272 864 216 880 216" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />
  <path d="M626 150 C748 150 788 164 880 190" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <rect x="54" y="346" width="950" height="42" rx="12" fill="#e0f2fe" stroke="#bae6fd" />
  <text x="529" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#075985">검토 기준: field 변경 → package specifier → version range → SemVer risk → verify 결과</text>
</svg>
