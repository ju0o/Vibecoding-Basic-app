<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">프롬프트 구현 루프</title>
  <desc id="desc">Prompt contract, implementation attempt, build/test/validate observation, follow-up prompt가 순환하는 구현 루프</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#042f2e" flood-opacity="0.13" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="#f0fdfa" />
  <text x="480" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#134e4a">검증 결과가 다음 prompt의 재료가 됩니다</text>
  <circle cx="480" cy="218" r="120" fill="#ccfbf1" stroke="#14b8a6" stroke-width="3" />
  <text x="480" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#115e59">Implementation</text>
  <text x="480" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0f766e">Loop</text>
  <g filter="url(#shadow)">
    <rect x="72" y="96" width="230" height="84" rx="18" fill="#fff" stroke="#5eead4" stroke-width="2" />
    <text x="187" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#115e59">Prompt Contract</text>
    <text x="187" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">goal + requirements + scope</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="658" y="96" width="230" height="84" rx="18" fill="#fff" stroke="#5eead4" stroke-width="2" />
    <text x="773" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#115e59">Implementation</text>
    <text x="773" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">code suggestion or agent diff</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="658" y="270" width="230" height="84" rx="18" fill="#fff" stroke="#5eead4" stroke-width="2" />
    <text x="773" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#115e59">Observation</text>
    <text x="773" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">build / test / review result</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="270" width="230" height="84" rx="18" fill="#fff" stroke="#5eead4" stroke-width="2" />
    <text x="187" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#115e59">Follow-up Prompt</text>
    <text x="187" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">failure log + preserved scope</text>
  </g>
  <path d="M302 138 C370 96 590 96 650 138" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M773 180 V262" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M658 312 C590 356 370 356 310 312" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M187 270 V188" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <text x="480" y="392" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0f766e">Stop condition: acceptance criteria와 verification이 충족되면 루프를 멈춥니다.</text>
</svg>
