<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="배포 후 운영 사이클: 관찰(로그)로 감지하고, 즉시 롤백으로 복구한 뒤, 로그로 원인을 분석하고 재발을 방지한다">
  <style>
    .lb { font: 600 13px sans-serif; fill: #334155; }
    .watch { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .detect { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .recover { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; }
    .analyze { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .cm { font: 600 12px sans-serif; fill: #0f172a; }
    .sub { font: 11px sans-serif; fill: #64748b; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .lb { fill: #e2e8f0; } .cm { fill: #f1f5f9; } .sub { fill: #94a3b8; }
      .watch { fill: #172554; stroke: #93c5fd; } .detect { fill: #450a0a; stroke: #fca5a5; }
      .recover { fill: #134e4a; stroke: #5eead4; } .analyze { fill: #451a03; stroke: #fbbf24; } .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  </defs>

  <rect class="watch" x="60" y="60" width="150" height="60" rx="10"/>
  <text class="cm" x="135" y="86" text-anchor="middle">① 관찰 (모니터링)</text>
  <text class="sub" x="135" y="106" text-anchor="middle">로그·지표로 지켜봄</text>

  <rect class="detect" x="510" y="60" width="150" height="60" rx="10"/>
  <text class="cm" x="585" y="86" text-anchor="middle">② 감지</text>
  <text class="sub" x="585" y="106" text-anchor="middle">5xx·지연 급증</text>

  <rect class="recover" x="510" y="200" width="150" height="60" rx="10"/>
  <text class="cm" x="585" y="226" text-anchor="middle">③ 롤백 (복구)</text>
  <text class="sub" x="585" y="246" text-anchor="middle">즉시 이전 배포로</text>

  <rect class="analyze" x="60" y="200" width="150" height="60" rx="10"/>
  <text class="cm" x="135" y="226" text-anchor="middle">④ 분석 · 재발 방지</text>
  <text class="sub" x="135" y="246" text-anchor="middle">로그로 원인 추적</text>

  <path class="edge" d="M210 90 L 506 90"/>
  <path class="edge" d="M585 120 L 585 196"/>
  <path class="edge" d="M508 230 L 214 230"/>
  <path class="edge" d="M135 200 L 135 124"/>

  <text class="sub" x="360" y="150" text-anchor="middle">복구가 원인 분석보다 먼저</text>
  <text class="sub" x="360" y="292" text-anchor="middle">배포는 끝이 아니라 시작 · 롤백은 코드만 되돌림(외부 상태 별도 점검)</text>
</svg>
