<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">자동화 Workflow 의존 그래프</title>
  <desc id="desc">Trigger, jobs, dependency, tool boundary, result record가 이어지는 자동화 workflow 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#ea580c" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="#fff7ed" />
  <text x="480" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#7c2d12">Workflow는 job 의존성을 명시해 예측 가능해집니다</text>
  <g filter="url(#shadow)">
    <rect x="58" y="126" width="150" height="102" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2" />
    <text x="133" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#c2410c">Trigger</text>
    <text x="133" y="196" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#ea580c">event</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="266" y="102" width="150" height="102" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2" />
    <text x="341" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#c2410c">Job A</text>
    <text x="341" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#ea580c">collect</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="266" y="238" width="150" height="102" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2" />
    <text x="341" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#c2410c">Job B</text>
    <text x="341" y="308" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#ea580c">lint/type</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="504" y="170" width="150" height="102" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2" />
    <text x="579" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#c2410c">Job C</text>
    <text x="579" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#ea580c">integrate</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="742" y="170" width="150" height="102" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2" />
    <text x="817" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#c2410c">Record</text>
    <text x="817" y="240" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#ea580c">evidence</text>
  </g>
  <path d="M208 177 H258" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M208 177 C230 177 232 289 258 289" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M416 153 C455 153 456 221 496 221" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M416 289 C455 289 456 221 496 221" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M654 221 H734" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)" />
  <text x="480" y="384" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#9a3412">tool call은 request이고, 실행은 workflow policy가 허용한 job에서만 일어납니다</text>
</svg>
