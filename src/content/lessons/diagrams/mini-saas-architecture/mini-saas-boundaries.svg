<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">미니 SaaS 신뢰 경계</title>
  <desc id="desc">브라우저, 서버, 인증과 권한, 데이터베이스, 환경 변수가 분리되는 미니 SaaS 아키텍처</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#134e4a" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="440" rx="28" fill="#ecfdf5" />
  <text x="480" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#134e4a">미니 SaaS는 신뢰 경계를 작게 세우는 구조입니다</text>
  <g filter="url(#shadow)">
    <rect x="54" y="134" width="180" height="126" rx="20" fill="#ffffff" stroke="#2dd4bf" stroke-width="2" />
    <text x="144" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f766e">Browser</text>
    <text x="144" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">UI interaction</text>
    <text x="144" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">no credentials</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="306" y="104" width="210" height="186" rx="22" fill="#ffffff" stroke="#2dd4bf" stroke-width="2" />
    <text x="411" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f766e">Server Boundary</text>
    <text x="411" y="181" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">authentication</text>
    <text x="411" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">authorization</text>
    <text x="411" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">query logic</text>
    <text x="411" y="253" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">server data fetch</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="104" width="140" height="86" rx="18" fill="#ffffff" stroke="#2dd4bf" stroke-width="2" />
    <text x="680" y="141" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f766e">Database</text>
    <text x="680" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">indexed rows</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="224" width="230" height="86" rx="18" fill="#ffffff" stroke="#2dd4bf" stroke-width="2" />
    <text x="725" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0f766e">Environment</text>
    <text x="725" y="286" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0f766e">configured outside source</text>
  </g>
  <path d="M234 197 H298" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M516 168 H602" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M516 242 H602" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)" />
  <text x="480" y="362" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">authentication은 identity를, authorization은 route와 data 접근을 결정합니다</text>
</svg>
