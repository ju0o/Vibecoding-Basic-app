<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Chat Coding 검증 루프</title>
  <desc id="desc">질문, 맥락, 대화형 답변, 후속 질문, 실행 검증, 사람 리뷰로 이어지는 chat coding 작업 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <style>
      .prompt { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 18; }
      .context { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 18; }
      .chat { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 18; }
      .verify { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 18; }
      .text { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="52" y="76" width="190" height="92" class="prompt" />
  <text x="147" y="112" text-anchor="middle" class="text">Question</text>
  <text x="147" y="138" text-anchor="middle" class="sub">error, goal, constraint</text>
  <rect x="300" y="76" width="190" height="92" class="context" />
  <text x="395" y="112" text-anchor="middle" class="text">Context</text>
  <text x="395" y="138" text-anchor="middle" class="sub">files, repo, history</text>
  <rect x="548" y="76" width="190" height="92" class="chat" />
  <text x="643" y="112" text-anchor="middle" class="text">Chat Answer</text>
  <text x="643" y="138" text-anchor="middle" class="sub">explain, steps, code</text>
  <rect x="610" y="254" width="190" height="92" class="prompt" />
  <text x="705" y="290" text-anchor="middle" class="text">Follow-up</text>
  <text x="705" y="316" text-anchor="middle" class="sub">narrow the hypothesis</text>
  <rect x="365" y="254" width="190" height="92" class="verify" />
  <text x="460" y="290" text-anchor="middle" class="text">Verify</text>
  <text x="460" y="316" text-anchor="middle" class="sub">run, test, source-check</text>
  <rect x="120" y="254" width="190" height="92" class="verify" />
  <text x="215" y="290" text-anchor="middle" class="text">Human Review</text>
  <text x="215" y="316" text-anchor="middle" class="sub">accept, reject, revise</text>
  <path d="M242 122 H300" class="line" />
  <path d="M490 122 H548" class="line" />
  <path d="M643 168 C702 204 706 224 705 254" class="line" />
  <path d="M610 300 H555" class="line" />
  <path d="M365 300 H310" class="line" />
  <path d="M215 254 C140 210 118 178 147 168" class="line" />
  <text x="460" y="418" text-anchor="middle" class="sub">Chat Coding은 답변을 믿는 흐름이 아니라 질문과 검증을 반복해 가설을 좁히는 흐름이다</text>
</svg>
