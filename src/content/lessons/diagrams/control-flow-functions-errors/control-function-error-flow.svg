<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Control Flow, Functions, and Errors</title>
  <desc id="desc">Input enters a function, branches through conditions, may loop over collections, returns a value or throws an error caught by error handling.</desc>
  <style>
    .bg { fill: #f8fbff; }
    .box { fill: #fff; stroke: #4b83c4; stroke-width: 2; rx: 16; }
    .warn { fill: #fff7f0; stroke: #d17a32; stroke-width: 2; rx: 16; }
    .label { fill: #18324f; font: 700 20px system-ui, sans-serif; }
    .text { fill: #36536d; font: 15px system-ui, sans-serif; }
    .arrow { stroke: #4b83c4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .err { stroke: #d17a32; stroke-width: 3; fill: none; marker-end: url(#arrowErr); stroke-dasharray: 8 6; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1720; }
      .box { fill: #162334; stroke: #78b7ff; }
      .warn { fill: #2a1b12; stroke: #ffad66; }
      .label { fill: #d7ebff; }
      .text { fill: #b8d4ef; }
      .arrow { stroke: #78b7ff; }
      .err { stroke: #ffad66; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b83c4" />
    </marker>
    <marker id="arrowErr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#d17a32" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="380" />
  <rect class="box" x="40" y="120" width="150" height="90" />
  <text class="label" x="78" y="156">Input</text>
  <text class="text" x="70" y="182">values / state</text>
  <path class="arrow" d="M195 165 H275" />
  <rect class="box" x="285" y="95" width="165" height="140" />
  <text class="label" x="330" y="138">Function</text>
  <text class="text" x="320" y="166">parameters</text>
  <text class="text" x="320" y="190">body</text>
  <text class="text" x="320" y="214">return value</text>
  <path class="arrow" d="M455 165 H535" />
  <rect class="box" x="545" y="80" width="165" height="95" />
  <text class="label" x="590" y="118">Branch</text>
  <text class="text" x="580" y="145">if / switch</text>
  <path class="arrow" d="M628 178 V250 H760" />
  <rect class="box" x="760" y="220" width="150" height="90" />
  <text class="label" x="792" y="256">Return</text>
  <text class="text" x="790" y="282">normal path</text>
  <path class="arrow" d="M628 80 V42 H760" />
  <rect class="box" x="760" y="20" width="150" height="75" />
  <text class="label" x="805" y="54">Loop</text>
  <text class="text" x="788" y="78">collection rule</text>
  <path class="err" d="M365 238 V325 H545" />
  <rect class="warn" x="555" y="300" width="190" height="60" />
  <text class="label" x="610" y="328">Error</text>
  <text class="text" x="595" y="350">throw / catch</text>
</svg>
