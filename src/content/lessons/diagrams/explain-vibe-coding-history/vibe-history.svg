<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">바이브코딩 역사와 오해 설명 순서</title>
  <desc id="desc">기원(Karpathy 2025)에서 사전 등재(Collins)로, 강한 뉘앙스를 맥락과 함께 소개한 뒤 검토는 여전히 필요하다는 오해 교정으로 닫는 설명 순서</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#be123c" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4c0519" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="410" rx="28" fill="#fff1f2" />
  <text x="480" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#9f1239">기원 사실 + 오해 교정을 함께 전한다</text>

  <g filter="url(#shadow)">
    <rect x="40" y="96" width="200" height="110" rx="16" fill="#ffe4e6" stroke="#fb7185" stroke-width="2" />
    <text x="140" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#9f1239">1. 기원</text>
    <text x="140" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#be123c">Karpathy 2025</text>
    <text x="140" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#be123c">X 게시물</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="264" y="96" width="200" height="110" rx="16" fill="#fecdd3" stroke="#f43f5e" stroke-width="2" />
    <text x="364" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#9f1239">2. 사전 등재</text>
    <text x="364" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#be123c">Collins 올해의 단어</text>
    <text x="364" y="178" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#be123c">coined vs popularised</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="488" y="96" width="200" height="110" rx="16" fill="#fda4af" stroke="#e11d48" stroke-width="2" />
    <text x="588" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#881337">3. 강한 뉘앙스</text>
    <text x="588" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9f1239">"forget the code</text>
    <text x="588" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9f1239">even exists" (맥락과 함께)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="712" y="96" width="208" height="110" rx="16" fill="#d9f99d" stroke="#84cc16" stroke-width="2" />
    <text x="816" y="126" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#3f6212">4. 오해 교정</text>
    <text x="816" y="154" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4d7c0f">"human review outputs"</text>
    <text x="816" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4d7c0f">검토는 여전히 필요</text>
  </g>

  <line x1="240" y1="151" x2="262" y2="151" stroke="#be123c" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="464" y1="151" x2="486" y2="151" stroke="#be123c" stroke-width="2.5" marker-end="url(#arrow)" />
  <line x1="688" y1="151" x2="710" y2="151" stroke="#be123c" stroke-width="2.5" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="180" y="268" width="600" height="88" rx="16" fill="#fef3c7" stroke="#eab308" stroke-width="2" />
    <text x="480" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#854d0e">자극적 표현만 떼어 전하면 위험한 오해를 심는다</text>
    <text x="480" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#a16207">"Trust in AI tools during vibe coding is dynamic" — 상황에 따라 신뢰를 조정</text>
  </g>
</svg>
