<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">MCP 도구 연결 프로젝트 지도</title>
  <desc id="desc">host가 client를 통해 MCP server에 연결하고, server가 도구를 노출하며, 토큰 규칙과 사용자 승인 경계가 감싸는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0369a1" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#082f49" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="420" rx="28" fill="#f0f9ff" />
  <text x="480" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#075985">USB-C처럼: 도구를 한 번 노출하면 어떤 host든 연결한다</text>

  <g filter="url(#shadow)">
    <rect x="60" y="100" width="220" height="120" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" />
    <text x="170" y="138" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#075985">Host (AI 앱)</text>
    <text x="170" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0369a1">연결을 시작</text>
    <text x="170" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0369a1">client가 1:1 관리</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="100" width="220" height="120" rx="18" fill="#bae6fd" stroke="#0ea5e9" stroke-width="2" />
    <text x="480" y="138" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#075985">MCP Server</text>
    <text x="480" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0369a1">도구·리소스 노출</text>
    <text x="480" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0369a1">읽기 도구부터 시작</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="680" y="100" width="220" height="120" rx="18" fill="#7dd3fc" stroke="#0284c7" stroke-width="2" />
    <text x="790" y="138" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#0c4a6e">외부 시스템</text>
    <text x="790" y="166" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#075985">파일 · DB · 사내 API</text>
    <text x="790" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#075985">(이 사이트 콘텐츠 등)</text>
  </g>

  <line x1="280" y1="160" x2="366" y2="160" stroke="#0369a1" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="323" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#0369a1">표준 연결</text>
  <line x1="590" y1="160" x2="676" y2="160" stroke="#0369a1" stroke-width="2.5" marker-end="url(#arrow)" />

  <g filter="url(#shadow)">
    <rect x="150" y="280" width="660" height="100" rx="16" fill="#fef3c7" stroke="#eab308" stroke-width="2" />
    <text x="480" y="314" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#854d0e">보안 경계 2규칙 + 승인 경계</text>
    <text x="480" y="342" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#a16207">① 토큰을 URI에 넣지 않는다 ② 자신에게 발급되지 않은 토큰은 받지 않는다(passthrough 금지)</text>
    <text x="480" y="364" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#a16207">③ 도구는 model-controlled — 파괴적 동작에는 사용자 승인 단계를 둔다</text>
  </g>
</svg>
