<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Files folders and paths tree</title>
  <desc id="desc">A folder tree showing how a full file path points to a specific file.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f5; }
      .folder { fill: #eef6ff; stroke: #0568d8; stroke-width: 2; }
      .file { fill: #f1fbf5; stroke: #36a66c; stroke-width: 2; }
      .note { fill: #ffffff; stroke: #deded8; stroke-width: 2; }
      .line { stroke: #85857e; stroke-width: 2; }
      .text { fill: #171717; font-family: Arial, sans-serif; }
      .muted { fill: #5f5f5b; font-family: Arial, sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #111111; }
        .folder { fill: #102840; stroke: #62a8ff; }
        .file { fill: #13291d; stroke: #45c779; }
        .note { fill: #202020; stroke: #363632; }
        .line { stroke: #8d8d86; }
        .text { fill: #f7f7f5; }
        .muted { fill: #b8b8b0; }
      }
    </style>
  </defs>
  <rect class="bg" width="920" height="560" rx="18" />
  <text class="text" x="460" y="48" font-size="28" font-weight="700" text-anchor="middle">파일·폴더·경로</text>
  <text class="muted" x="460" y="78" font-size="16" text-anchor="middle">파일 이름보다 전체 경로가 더 정확한 식별자입니다.</text>

  <rect class="folder" x="90" y="130" width="190" height="58" rx="10" />
  <text class="text" x="185" y="166" font-size="18" font-weight="700" text-anchor="middle">project</text>
  <line class="line" x1="185" y1="188" x2="185" y2="230" />

  <rect class="folder" x="90" y="230" width="190" height="58" rx="10" />
  <text class="text" x="185" y="266" font-size="18" font-weight="700" text-anchor="middle">src</text>
  <line class="line" x1="185" y1="288" x2="185" y2="330" />

  <rect class="folder" x="90" y="330" width="190" height="58" rx="10" />
  <text class="text" x="185" y="366" font-size="18" font-weight="700" text-anchor="middle">content</text>
  <line class="line" x1="280" y1="359" x2="365" y2="359" />

  <rect class="folder" x="365" y="330" width="190" height="58" rx="10" />
  <text class="text" x="460" y="366" font-size="18" font-weight="700" text-anchor="middle">lessons</text>
  <line class="line" x1="555" y1="359" x2="640" y2="359" />

  <rect class="file" x="640" y="330" width="190" height="58" rx="10" />
  <text class="text" x="735" y="366" font-size="18" font-weight="700" text-anchor="middle">intro.md</text>

  <rect class="note" x="365" y="145" width="465" height="105" rx="12" />
  <text class="text" x="392" y="178" font-size="18" font-weight="700">Full path</text>
  <text class="muted" x="392" y="210" font-size="16">project/src/content/lessons/intro.md</text>
  <text class="muted" x="392" y="235" font-size="13">folder structure + base name + extension</text>

  <rect class="note" x="90" y="430" width="740" height="72" rx="12" />
  <text class="text" x="460" y="460" font-size="18" font-weight="700" text-anchor="middle">AI 요청의 좋은 형태</text>
  <text class="muted" x="460" y="486" font-size="15" text-anchor="middle">"intro.md를 고쳐줘"보다 "project/src/content/lessons/intro.md를 고쳐줘"가 더 정확합니다.</text>
</svg>
