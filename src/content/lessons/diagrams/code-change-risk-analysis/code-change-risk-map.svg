<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">코드 변경 위험 분석 지도</title>
  <desc id="desc">Changed files와 code scanning alert, manual review boundary를 통해 verification과 review decision을 정하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#450a0a" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="960" height="430" rx="28" fill="#fff7ed" />
  <text x="480" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#7f1d1d">변경 위험은 diff, 자동 alert, 사람 맥락 검토를 함께 봅니다</text>
  <g filter="url(#shadow)">
    <rect x="52" y="110" width="190" height="116" rx="18" fill="#fee2e2" stroke="#f87171" stroke-width="2" />
    <text x="147" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#991b1b">Diff Scope</text>
    <text x="147" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#b91c1c">changed files</text>
    <text x="147" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#b91c1c">differences</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="292" y="110" width="190" height="116" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2" />
    <text x="387" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#9a3412">Risk Signal</text>
    <text x="387" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#c2410c">security alert</text>
    <text x="387" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#c2410c">auth / data / config</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="532" y="110" width="190" height="116" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <text x="627" y="142" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#92400e">Manual Boundary</text>
    <text x="627" y="176" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#92400e">business logic</text>
    <text x="627" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#92400e">context understanding</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="772" y="110" width="136" height="116" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
    <text x="840" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#166534">Decision</text>
    <text x="840" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#166534">approve</text>
    <text x="840" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#166534">request</text>
  </g>
  <path d="M242 168 H284" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M482 168 H524" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M722 168 H764" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" />
  <rect x="130" y="290" width="700" height="82" rx="18" fill="#fff" stroke="#fed7aa" stroke-width="2" />
  <text x="480" y="322" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7c2d12">Verification은 risk에 맞춰 배정합니다</text>
  <text x="480" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9a3412">높은 위험: 추가 test, security review, 수동 시나리오, rollback 준비</text>
</svg>
