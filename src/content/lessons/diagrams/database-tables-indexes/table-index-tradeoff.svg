<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="데이터베이스 테이블은 행과 열로 이루어지고, 인덱스는 조회를 빠르게 하되 쓰기에 비용을 더한다">
  <style>
    .hd { font: 600 13px sans-serif; fill: #334155; }
    .cm { font: 600 12px monospace; fill: #0f172a; }
    .cell { font: 11px sans-serif; fill: #334155; }
    .col { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.2; }
    .row { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
    .idx { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; }
    .cost { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .sub { font: 11px sans-serif; fill: #64748b; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .hd { fill: #e2e8f0; } .cm { fill: #f1f5f9; } .cell { fill: #e2e8f0; } .sub { fill: #94a3b8; }
      .col { fill: #172554; stroke: #93c5fd; } .row { fill: #1e293b; stroke: #94a3b8; }
      .idx { fill: #134e4a; stroke: #5eead4; } .cost { fill: #450a0a; stroke: #fca5a5; } .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  </defs>

  <text class="hd" x="20" y="26">테이블 = 행 × 열</text>
  <!-- table -->
  <rect class="col" x="24" y="40" width="70" height="26"/><text class="cm" x="59" y="58" text-anchor="middle">id</text>
  <rect class="col" x="94" y="40" width="130" height="26"/><text class="cm" x="159" y="58" text-anchor="middle">email</text>
  <rect class="col" x="224" y="40" width="70" height="26"/><text class="cm" x="259" y="58" text-anchor="middle">age</text>
  <rect class="row" x="24" y="66" width="70" height="24"/><text class="cell" x="59" y="82" text-anchor="middle">1</text>
  <rect class="row" x="94" y="66" width="130" height="24"/><text class="cell" x="159" y="82" text-anchor="middle">a@x.com</text>
  <rect class="row" x="224" y="66" width="70" height="24"/><text class="cell" x="259" y="82" text-anchor="middle">25</text>
  <rect class="row" x="24" y="90" width="70" height="24"/><text class="cell" x="59" y="106" text-anchor="middle">2</text>
  <rect class="row" x="94" y="90" width="130" height="24"/><text class="cell" x="159" y="106" text-anchor="middle">b@x.com</text>
  <rect class="row" x="224" y="90" width="70" height="24"/><text class="cell" x="259" y="106" text-anchor="middle">31</text>
  <text class="sub" x="24" y="132">열=구조·타입 고정 · 행=내용 가변</text>
  <text class="sub" x="24" y="150">데이터 타입: 값 제한 + 계산 의미 부여</text>

  <!-- index benefit -->
  <rect class="idx" x="380" y="46" width="300" height="72" rx="10"/>
  <text class="hd" x="530" y="72" text-anchor="middle">인덱스 = 색인</text>
  <text class="sub" x="530" y="94" text-anchor="middle">전수 스캔 대신 트리 탐색 — 조회·조인 가속</text>
  <text class="sub" x="530" y="110" text-anchor="middle">(읽기에서 번다)</text>
  <path class="edge" d="M300 80 L 376 80"/>

  <!-- write cost -->
  <rect class="cost" x="380" y="150" width="300" height="72" rx="10"/>
  <text class="hd" x="530" y="176" text-anchor="middle">유지 비용</text>
  <text class="sub" x="530" y="198" text-anchor="middle">INSERT/UPDATE/DELETE마다 인덱스도 갱신</text>
  <text class="sub" x="530" y="214" text-anchor="middle">"adds overhead" (쓰기에서 낸다)</text>

  <text class="sub" x="360" y="270" text-anchor="middle">인덱스 설계 = 읽기 이득 vs 쓰기 비용의 저울질 — 안 쓰는 인덱스는 순손실(제거 권고)</text>
</svg>
