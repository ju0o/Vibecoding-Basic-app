<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" role="img" aria-labelledby="title desc">
  <title id="title">Vibe coding origin and verification boundary</title>
  <desc id="desc">A timeline from Karpathy's post to dictionary recognition and safety review practices.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f5; }
      .line { stroke: #0568d8; stroke-width: 4; }
      .card { fill: #ffffff; stroke: #deded8; stroke-width: 2; }
      .source { fill: #eef6ff; stroke: #0568d8; stroke-width: 2; }
      .risk { fill: #fff8e8; stroke: #df9b22; stroke-width: 2; }
      .text { fill: #171717; font-family: Arial, sans-serif; }
      .muted { fill: #5f5f5b; font-family: Arial, sans-serif; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #111111; }
        .card { fill: #202020; stroke: #363632; }
        .source { fill: #102840; stroke: #62a8ff; }
        .risk { fill: #31240d; stroke: #f0b44b; }
        .text { fill: #f7f7f5; }
        .muted { fill: #b8b8b0; }
        .line { stroke: #62a8ff; }
      }
    </style>
  </defs>
  <rect class="bg" width="940" height="540" rx="18" />
  <text class="text" x="470" y="48" font-size="28" font-weight="700" text-anchor="middle">바이브코딩: 기원과 검증 경계</text>
  <text class="muted" x="470" y="78" font-size="16" text-anchor="middle">용어 역사와 안전 원칙을 함께 읽어야 균형이 잡힙니다.</text>
  <line class="line" x1="120" y1="190" x2="820" y2="190" />

  <circle class="source" cx="150" cy="190" r="18" />
  <rect class="card" x="60" y="225" width="180" height="105" rx="10" />
  <text class="text" x="150" y="255" font-size="17" font-weight="700" text-anchor="middle">Karpathy 2025</text>
  <text class="muted" x="150" y="282" font-size="13" text-anchor="middle">"vibe coding"</text>
  <text class="muted" x="150" y="304" font-size="13" text-anchor="middle">Wayback 대조</text>

  <circle class="source" cx="360" cy="190" r="18" />
  <rect class="card" x="270" y="95" width="180" height="105" rx="10" />
  <text class="text" x="360" y="125" font-size="17" font-weight="700" text-anchor="middle">사전 기록</text>
  <text class="muted" x="360" y="152" font-size="13" text-anchor="middle">Collins WOTY</text>
  <text class="muted" x="360" y="174" font-size="13" text-anchor="middle">Merriam-Webster</text>

  <circle class="source" cx="570" cy="190" r="18" />
  <rect class="card" x="480" y="225" width="180" height="105" rx="10" />
  <text class="text" x="570" y="255" font-size="17" font-weight="700" text-anchor="middle">연구·보도</text>
  <text class="muted" x="570" y="282" font-size="13" text-anchor="middle">Business Insider</text>
  <text class="muted" x="570" y="304" font-size="13" text-anchor="middle">arXiv 분석</text>

  <circle class="risk" cx="780" cy="190" r="18" />
  <rect class="risk" x="690" y="95" width="180" height="105" rx="10" />
  <text class="text" x="780" y="125" font-size="17" font-weight="700" text-anchor="middle">검증 경계</text>
  <text class="muted" x="780" y="152" font-size="13" text-anchor="middle">human review</text>
  <text class="muted" x="780" y="174" font-size="13" text-anchor="middle">risk-based trust</text>

  <rect class="risk" x="155" y="390" width="630" height="78" rx="12" />
  <text class="text" x="470" y="420" font-size="19" font-weight="700" text-anchor="middle">교육적 결론</text>
  <text class="muted" x="470" y="448" font-size="15" text-anchor="middle">자연어로 빠르게 만들 수 있을수록, 사람이 diff·test·출처를 더 정확히 검증해야 합니다.</text>
</svg>
