<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">사람-AI 협업 루프</title>
  <desc id="desc">사람의 목표 설정, AI의 조사와 초안, 사람의 리뷰와 테스트, feedback과 최종 판단으로 이어지는 협업 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <style>
      .human { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 18; }
      .ai { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 18; }
      .verify { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 18; }
      .text { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="58" y="72" width="190" height="92" class="human" />
  <text x="153" y="108" text-anchor="middle" class="text">Frame Task</text>
  <text x="153" y="134" text-anchor="middle" class="sub">intent, scope, criteria</text>
  <rect x="306" y="72" width="190" height="92" class="ai" />
  <text x="401" y="108" text-anchor="middle" class="text">AI Draft</text>
  <text x="401" y="134" text-anchor="middle" class="sub">explain, propose, edit</text>
  <rect x="554" y="72" width="190" height="92" class="verify" />
  <text x="649" y="108" text-anchor="middle" class="text">Review Output</text>
  <text x="649" y="134" text-anchor="middle" class="sub">diff, source, risk</text>
  <rect x="646" y="252" width="190" height="92" class="verify" />
  <text x="741" y="288" text-anchor="middle" class="text">Run Tests</text>
  <text x="741" y="314" text-anchor="middle" class="sub">verify behavior</text>
  <rect x="364" y="252" width="190" height="92" class="ai" />
  <text x="459" y="288" text-anchor="middle" class="text">Feedback</text>
  <text x="459" y="314" text-anchor="middle" class="sub">revise prompt or task</text>
  <rect x="82" y="252" width="190" height="92" class="human" />
  <text x="177" y="288" text-anchor="middle" class="text">Final Call</text>
  <text x="177" y="314" text-anchor="middle" class="sub">commit, merge, reject</text>
  <path d="M248 118 H306" class="line" />
  <path d="M496 118 H554" class="line" />
  <path d="M649 164 C720 202 736 222 741 252" class="line" />
  <path d="M646 298 H554" class="line" />
  <path d="M364 298 H272" class="line" />
  <path d="M177 252 C116 210 116 178 153 164" class="line" />
  <text x="460" y="418" text-anchor="middle" class="sub">AI는 실행과 초안을 돕고, 사람은 의도·검증·최종 책임을 소유한다</text>
</svg>
