<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Git 세 영역과 기록 사이클">
  <style>
    .box { fill: none; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .label { font: 600 14px sans-serif; fill: #334155; }
    .sub { font: 11px sans-serif; fill: #64748b; }
    .cmd { font: 600 12px monospace; fill: #0f766e; }
    .arrow { stroke: #0f766e; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .cmp { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #e2e8f0; } .sub { fill: #94a3b8; } .cmd { fill: #5eead4; }
      .arrow { stroke: #5eead4; } .box { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="60" width="200" height="110" rx="8"/>
  <text class="label" x="120" y="90" text-anchor="middle">워킹 트리</text>
  <text class="sub" x="120" y="112" text-anchor="middle">편집 중인 실제 파일</text>
  <text class="sub" x="120" y="130" text-anchor="middle">(눈에 보이는 폴더)</text>

  <rect class="box" x="260" y="60" width="200" height="110" rx="8"/>
  <text class="label" x="360" y="90" text-anchor="middle">인덱스</text>
  <text class="sub" x="360" y="112" text-anchor="middle">다음 커밋의 준비 공간</text>
  <text class="sub" x="360" y="130" text-anchor="middle">(= staging area)</text>

  <rect class="box" x="500" y="60" width="200" height="110" rx="8"/>
  <text class="label" x="600" y="90" text-anchor="middle">HEAD</text>
  <text class="sub" x="600" y="112" text-anchor="middle">마지막 커밋</text>
  <text class="sub" x="600" y="130" text-anchor="middle">(현재 브랜치의 끝)</text>

  <path class="arrow" d="M220 100 L258 100"/>
  <text class="cmd" x="239" y="92" text-anchor="middle">git add</text>
  <path class="arrow" d="M460 100 L498 100"/>
  <text class="cmd" x="479" y="92" text-anchor="middle">git commit</text>

  <path class="cmp" d="M120 172 C 120 230, 600 230, 600 172"/>
  <text class="sub" x="360" y="238" text-anchor="middle">git status = 세 영역의 차이를 세 묶음으로 표시</text>

  <text class="cmd" x="60" y="40">git init</text>
  <text class="sub" x="120" y="40">→ .git 디렉터리 생성 (사이클의 시작)</text>
</svg>
