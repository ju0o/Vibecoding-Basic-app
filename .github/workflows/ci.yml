name: Source Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build slide bundle
        run: npm run build:slides

      - name: Verify generated bundle is committed
        run: git diff --exit-code -- src/content/sessions/session-03-direction.bundle.js

      - name: Run source checks
        run: npm run check
