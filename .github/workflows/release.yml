name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        run: npm run release:verify -- "${{ github.ref_name }}"

      - name: Build Windows portable EXE
        run: npm run release:build

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "Setup" } |
            Select-Object -First 1
          if (-not $exe) {
            throw "Portable EXE was not generated."
          }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName
          "$($hash.Hash.ToLower())  $($exe.Name)" |
            Set-Content -LiteralPath "release/SHA256SUMS.txt" -Encoding ascii

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -Path release -Filter "*.exe" |
            Where-Object { $_.Name -notmatch "Setup" } |
            Select-Object -First 1
          $checksum = Resolve-Path "release/SHA256SUMS.txt"
          $assets = @($exe.FullName, $checksum.Path)

          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $assets `
              --repo "${{ github.repository }}" `
              --title "바이브코딩 기초반 $tag" `
              --generate-notes
          }

          # GitHub CLI on Windows may shorten a Unicode asset basename.
          # Normalize the uploaded EXE name through the GitHub API.
          $version = node -p "require('./package.json').version"
          $expectedName = "바이브코딩 기초반 $version.exe"
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" |
            ConvertFrom-Json
          $exeAsset = $release.assets |
            Where-Object { $_.name -like "*.exe" } |
            Sort-Object created_at -Descending |
            Select-Object -First 1

          if ($exeAsset -and $exeAsset.name -ne $expectedName) {
            gh api --method PATCH `
              "repos/${{ github.repository }}/releases/assets/$($exeAsset.id)" `
              -f "name=$expectedName"
          }
