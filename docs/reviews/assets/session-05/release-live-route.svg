<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="112" y1="40" x2="1480" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171238"/>
      <stop offset="1" stop-color="#0C0A1F"/>
    </linearGradient>
    <linearGradient id="route" x1="272" y1="482" x2="1334" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A7BFF"/>
      <stop offset=".45" stop-color="#5CF0A8"/>
      <stop offset="1" stop-color="#FFB14E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="126" y="142" fill="#8A7BFF" font-size="18" font-weight="700" letter-spacing="3" font-family="Pretendard, Arial, sans-serif">SESSION 05 · RELEASE TO LIVE</text>
  <text x="126" y="206" fill="#F4F1FF" font-size="56" font-weight="800" font-family="Pretendard, Arial, sans-serif">검증한 release가 공개 URL이 되는 경로를 단계로 제시</text>
  <text x="126" y="252" fill="#A99FCE" font-size="24" font-family="Pretendard, Arial, sans-serif">학생이 무엇을 먼저 확인해야 하는지 명확해지도록, release · build · connect · live를 한 줄 위계로 보여줍니다.</text>

  <g opacity=".95">
    <line x1="272" y1="504" x2="1334" y2="504" stroke="url(#route)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="272" cy="504" r="84" fill="#19173B" stroke="rgba(138,123,255,.34)"/>
    <circle cx="272" cy="504" r="52" fill="#8A7BFF" fill-opacity=".18"/>
    <text x="232" y="490" fill="#8A7BFF" font-size="16" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">01</text>
    <text x="226" y="522" fill="#F4F1FF" font-size="28" font-weight="800" font-family="Pretendard, Arial, sans-serif">RELEASE</text>
    <text x="184" y="622" fill="#A99FCE" font-size="18" font-family="Pretendard, Arial, sans-serif">검증 기준점 선택</text>
  </g>

  <g>
    <circle cx="626" cy="504" r="84" fill="#19173B" stroke="rgba(92,240,168,.34)"/>
    <circle cx="626" cy="504" r="52" fill="#5CF0A8" fill-opacity=".18"/>
    <text x="587" y="490" fill="#5CF0A8" font-size="16" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">02</text>
    <text x="576" y="522" fill="#F4F1FF" font-size="28" font-weight="800" font-family="Pretendard, Arial, sans-serif">BUILD</text>
    <text x="548" y="622" fill="#A99FCE" font-size="18" font-family="Pretendard, Arial, sans-serif">코드가 실행 가능한 결과로</text>
  </g>

  <g>
    <circle cx="980" cy="504" r="84" fill="#19173B" stroke="rgba(92,240,168,.34)"/>
    <circle cx="980" cy="504" r="52" fill="#5CF0A8" fill-opacity=".18"/>
    <text x="941" y="490" fill="#5CF0A8" font-size="16" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">03</text>
    <text x="920" y="522" fill="#F4F1FF" font-size="28" font-weight="800" font-family="Pretendard, Arial, sans-serif">CONNECT</text>
    <text x="896" y="622" fill="#A99FCE" font-size="18" font-family="Pretendard, Arial, sans-serif">환경변수 · 데이터 연결</text>
  </g>

  <g>
    <circle cx="1334" cy="504" r="84" fill="#19173B" stroke="rgba(255,177,78,.38)"/>
    <circle cx="1334" cy="504" r="52" fill="#FFB14E" fill-opacity=".2"/>
    <text x="1294" y="490" fill="#FFB14E" font-size="16" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">04</text>
    <text x="1305" y="522" fill="#F4F1FF" font-size="28" font-weight="800" font-family="Pretendard, Arial, sans-serif">LIVE</text>
    <text x="1248" y="622" fill="#A99FCE" font-size="18" font-family="Pretendard, Arial, sans-serif">공개 URL로 실제 확인</text>
  </g>

  <g opacity=".92">
    <rect x="228" y="714" width="1176" height="104" rx="24" fill="#0F1530" stroke="rgba(206,198,255,.08)"/>
    <text x="270" y="758" fill="#F4F1FF" font-size="24" font-weight="700" font-family="Pretendard, Arial, sans-serif">모션 제안</text>
    <text x="416" y="758" fill="#A99FCE" font-size="21" font-family="Pretendard, Arial, sans-serif">버튼 클릭마다 각 노드가 차례로 밝아지고, 마지막 LIVE 노드는 확대 + URL 태그 등장으로 마무리</text>
    <rect x="270" y="782" width="162" height="16" rx="8" fill="#251E53"/>
    <rect x="270" y="782" width="118" height="16" rx="8" fill="#8A7BFF"/>
    <rect x="450" y="782" width="162" height="16" rx="8" fill="#20303C"/>
    <rect x="450" y="782" width="118" height="16" rx="8" fill="#5CF0A8"/>
    <rect x="630" y="782" width="162" height="16" rx="8" fill="#20303C"/>
    <rect x="630" y="782" width="118" height="16" rx="8" fill="#5CF0A8"/>
    <rect x="810" y="782" width="162" height="16" rx="8" fill="#2C223A"/>
    <rect x="810" y="782" width="118" height="16" rx="8" fill="#FFB14E"/>
  </g>
