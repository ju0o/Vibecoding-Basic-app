    <rect x="1250" y="627" width="138" height="10" rx="5" fill="#F4F1FF" fill-opacity=".86"/>
    <text x="1202" y="690" fill="#A99FCE" font-size="18" font-family="Pretendard, Arial, sans-serif">배포 플랫폼에만 실제 값 입력</text>
  </g>

  <g opacity=".95">
    <line x1="430" y1="540" x2="650" y2="540" stroke="rgba(206,198,255,.28)" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round"/>
    <line x1="950" y1="540" x2="1164" y2="540" stroke="rgba(206,198,255,.28)" stroke-width="8" stroke-dasharray="14 18" stroke-linecap="round"/>
    <rect x="494" y="508" width="98" height="64" rx="20" fill="url(#capsule)"/>
    <circle cx="516" cy="540" r="10" fill="#2D1730"/>
    <text x="538" y="548" fill="#2D1730" font-size="18" font-weight="800" font-family="Pretendard, Arial, sans-serif">SECRET</text>
