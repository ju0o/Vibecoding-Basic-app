    <text x="254" y="824" fill="#F4F1FF" font-size="24" font-weight="700" font-family="Pretendard, Arial, sans-serif">모션 제안</text>
    <text x="400" y="824" fill="#A99FCE" font-size="21" font-family="Pretendard, Arial, sans-serif">비밀 캡슐이 왼쪽에서 출발해 가운데 차단 게이트를 통과하지 못하고, 우회해 우측 설정 박스에 안착하는 흐름으로 연출</text>
