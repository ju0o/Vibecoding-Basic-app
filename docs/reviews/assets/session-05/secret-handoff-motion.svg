    <path d="M758 494V590" stroke="#FF5D8F" stroke-width="12" stroke-linecap="round"/>
    <path d="M842 494V590" stroke="#FF5D8F" stroke-width="12" stroke-linecap="round"/>
    <rect x="724" y="470" width="152" height="34" rx="17" fill="#2A1530"/>
