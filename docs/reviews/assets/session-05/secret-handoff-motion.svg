    <circle cx="1230" cy="559" r="10" fill="#5CF0A8"/>
    <circle cx="1230" cy="635" r="10" fill="#5CF0A8"/>
    <rect x="1250" y="475" width="128" height="10" rx="5" fill="#F4F1FF" fill-opacity=".86"/>
