      <stop stop-color="#171238"/>
      <stop offset="1" stop-color="#0C0A1F"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF5D8F"/>
      <stop offset="1" stop-color="#FFB14E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="122" y="138" fill="#FFB14E" font-size="18" font-weight="700" letter-spacing="3" font-family="Pretendard, Arial, sans-serif">SESSION 05 · SECRET HANDOFF</text>
  <text x="122" y="202" fill="#F4F1FF" font-size="56" font-weight="800" font-family="Pretendard, Arial, sans-serif">비밀값은 코드가 아니라 실행 환경으로 전달됩니다</text>
  <text x="122" y="248" fill="#A99FCE" font-size="24" font-family="Pretendard, Arial, sans-serif">`.env.local`은 내 PC에, Git은 차단 지점에, 배포 설정은 보호된 저장소에 두는 흐름을 한눈에 보여줍니다.</text>

  <g>
    <rect x="138" y="360" width="298" height="360" rx="30" fill="#15112E" stroke="rgba(206,198,255,.12)"/>
    <text x="180" y="414" fill="#5CF0A8" font-size="18" font-weight="700" letter-spacing="2" font-family="Pretendard, Arial, sans-serif">LOCAL FILE</text>
    <rect x="180" y="454" width="214" height="198" rx="22" fill="#101827" stroke="rgba(92,240,168,.28)"/>
    <text x="206" y="494" fill="#F4F1FF" font-size="24" font-weight="700" font-family="Pretendard, Arial, sans-serif">.env.local</text>
    <rect x="206" y="526" width="148" height="12" rx="6" fill="#8A7BFF"/>
    <rect x="206" y="556" width="126" height="12" rx="6" fill="#FF5D8F"/>
    <rect x="206" y="586" width="168" height="12" rx="6" fill="#FFB14E"/>
