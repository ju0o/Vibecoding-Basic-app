<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
  <title id="title">Terminal command execution flow</title>
  <desc id="desc">A flow from terminal input through shell evaluation to command output in the current directory.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f5; }
      .card { fill: #ffffff; stroke: #deded8; stroke-width: 2; }
      .accent { fill: #eef6ff; stroke: #0568d8; stroke-width: 2; }
      .warn { fill: #fff8e8; stroke: #df9b22; stroke-width: 2; }
      .text { fill: #171717; font-family: Arial, sans-serif; }
      .muted { fill: #5f5f5b; font-family: Arial, sans-serif; }
      .arrow { fill: none; stroke: #0568d8; stroke-width: 4; marker-end: url(#arrowhead); }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #111111; }
        .card { fill: #202020; stroke: #363632; }
        .accent { fill: #102840; stroke: #62a8ff; }
        .warn { fill: #31240d; stroke: #f0b44b; }
        .text { fill: #f7f7f5; }
        .muted { fill: #b8b8b0; }
        .arrow { stroke: #62a8ff; }
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0568d8" />
    </marker>
  </defs>
  <rect class="bg" width="920" height="540" rx="18" />
  <text class="text" x="460" y="48" font-size="28" font-weight="700" text-anchor="middle">터미널 명령 실행 흐름</text>
  <text class="muted" x="460" y="78" font-size="16" text-anchor="middle">화면, shell, 현재 위치, output을 분리해 읽습니다.</text>

  <rect class="card" x="55" y="165" width="190" height="110" rx="12" />
  <text class="text" x="150" y="200" font-size="20" font-weight="700" text-anchor="middle">Terminal</text>
  <text class="muted" x="150" y="228" font-size="14" text-anchor="middle">text-based UI</text>
  <text class="muted" x="150" y="250" font-size="14" text-anchor="middle">input + output</text>

  <rect class="accent" x="285" y="165" width="190" height="110" rx="12" />
  <text class="text" x="380" y="200" font-size="20" font-weight="700" text-anchor="middle">Shell</text>
  <text class="muted" x="380" y="228" font-size="14" text-anchor="middle">evaluate input</text>
  <text class="muted" x="380" y="250" font-size="14" text-anchor="middle">execute command</text>

  <rect class="warn" x="515" y="165" width="190" height="110" rx="12" />
  <text class="text" x="610" y="200" font-size="20" font-weight="700" text-anchor="middle">Current Directory</text>
  <text class="muted" x="610" y="228" font-size="14" text-anchor="middle">workspace root</text>
  <text class="muted" x="610" y="250" font-size="14" text-anchor="middle">path 기준</text>

  <rect class="card" x="745" y="165" width="130" height="110" rx="12" />
  <text class="text" x="810" y="200" font-size="20" font-weight="700" text-anchor="middle">Output</text>
  <text class="muted" x="810" y="228" font-size="14" text-anchor="middle">result</text>
  <text class="muted" x="810" y="250" font-size="14" text-anchor="middle">error</text>

  <path class="arrow" d="M250 220 H275" />
  <path class="arrow" d="M480 220 H505" />
  <path class="arrow" d="M710 220 H735" />

  <rect class="accent" x="110" y="350" width="700" height="78" rx="12" />
  <text class="text" x="460" y="382" font-size="19" font-weight="700" text-anchor="middle">AI 협업에서 남길 기록</text>
  <text class="muted" x="460" y="410" font-size="15" text-anchor="middle">shell profile + current directory + command + output summary</text>
</svg>
