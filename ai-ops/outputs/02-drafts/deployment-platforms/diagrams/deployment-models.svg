<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="배포 두 모델: 정적 CDN 호스팅은 빌드 파일을 전 세계 엣지에 캐시해 서빙하고, 서버·함수 모델은 요청마다 코드를 실행한다">
  <style>
    .lb { font: 600 13px sans-serif; fill: #334155; }
    .hd { font: 600 12px sans-serif; fill: #334155; }
    .static { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; }
    .edge2 { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.2; }
    .server { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .box { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; }
    .cm { font: 600 11px monospace; fill: #0f172a; }
    .sub { font: 11px sans-serif; fill: #64748b; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .lb { fill: #e2e8f0; } .hd { fill: #e2e8f0; } .cm { fill: #f1f5f9; } .sub { fill: #94a3b8; }
      .static { fill: #134e4a; stroke: #5eead4; } .edge2 { fill: #172554; stroke: #93c5fd; }
      .server { fill: #451a03; stroke: #fbbf24; } .box { fill: #1e293b; stroke: #94a3b8; } .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  </defs>

  <!-- static model -->
  <text class="hd" x="30" y="28">정적 CDN 호스팅 (Firebase — 이 사이트)</text>
  <rect class="box" x="24" y="40" width="110" height="40" rx="8"/>
  <text class="cm" x="79" y="64" text-anchor="middle">빌드 파일</text>
  <path class="edge" d="M134 60 L 168 60"/>
  <rect class="edge2" x="170" y="36" width="70" height="22" rx="5"/><text class="sub" x="205" y="51" text-anchor="middle">엣지 서울</text>
  <rect class="edge2" x="170" y="62" width="70" height="22" rx="5"/><text class="sub" x="205" y="77" text-anchor="middle">엣지 런던</text>
  <rect class="edge2" x="250" y="36" width="70" height="22" rx="5"/><text class="sub" x="285" y="51" text-anchor="middle">엣지 도쿄</text>
  <rect class="edge2" x="250" y="62" width="70" height="22" rx="5"/><text class="sub" x="285" y="77" text-anchor="middle">엣지 뉴욕</text>
  <rect class="static" x="360" y="46" width="120" height="34" rx="8"/>
  <text class="sub" x="420" y="67" text-anchor="middle">사용자 (즉시·HTTPS)</text>
  <path class="edge" d="M320 60 L 356 60"/>
  <text class="sub" x="250" y="100">파일을 전 세계에 캐시 → 가까운 엣지에서 그대로 서빙 (런타임 서버 없음)</text>

  <!-- divider -->
  <line x1="24" y1="120" x2="696" y2="120" stroke="#94a3b8" stroke-dasharray="4 4"/>

  <!-- server model -->
  <text class="hd" x="30" y="150">서버·함수 모델</text>
  <rect class="box" x="24" y="164" width="120" height="40" rx="8"/>
  <text class="sub" x="84" y="188" text-anchor="middle">요청</text>
  <path class="edge" d="M144 184 L 180 184"/>
  <rect class="server" x="182" y="162" width="150" height="44" rx="8"/>
  <text class="cm" x="257" y="184" text-anchor="middle">서버/함수 실행</text>
  <text class="sub" x="257" y="200" text-anchor="middle">요청마다 코드 실행</text>
  <path class="edge" d="M332 184 L 368 184"/>
  <rect class="box" x="370" y="164" width="130" height="40" rx="8"/>
  <text class="sub" x="435" y="188" text-anchor="middle">동적 응답 (DB·인증)</text>
  <text class="sub" x="250" y="226">사용자별 페이지·실시간 데이터가 필요할 때</text>

  <!-- unique URL note -->
  <rect class="static" x="24" y="250" width="672" height="60" rx="10"/>
  <text class="lb" x="360" y="274" text-anchor="middle">배포마다 고유 URL</text>
  <text class="sub" x="360" y="296" text-anchor="middle">Preview에서 검증 → Production 승격 → 문제 시 이전 배포로 롤백 (덮어쓰기가 아니라 쌓기)</text>
</svg>
