<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">React State and Effects Flow</title>
  <desc id="desc">React flow showing event handler, state setter, render snapshot, commit, effect, dependency, and external system synchronization.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .state { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .render { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .effect { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
    .external { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
    .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
    .label { font: 700 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
    .small { font: 500 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="640"/>
  <rect class="panel" x="48" y="38" width="904" height="564" rx="24"/>
  <text class="title" x="82" y="82">State는 render를 예약하고, Effect는 외부 시스템과 동기화한다</text>

  <rect class="state" x="86" y="144" width="190" height="100" rx="18"/>
  <text class="label" x="126" y="178">Event Handler</text>
  <text class="mono" x="124" y="210">setCount(...)</text>

  <rect class="state" x="366" y="144" width="210" height="100" rx="18"/>
  <text class="label" x="426" y="178">State Queue</text>
  <text class="small" x="402" y="210">updates after handler</text>

  <rect class="render" x="672" y="144" width="220" height="100" rx="18"/>
  <text class="label" x="732" y="178">Render Snapshot</text>
  <text class="small" x="704" y="210">current state is fixed</text>

  <path class="arrow" d="M276 194 H366"/>
  <text class="small" x="292" y="180">setter</text>
  <path class="arrow" d="M576 194 H672"/>
  <text class="small" x="596" y="180">next render</text>

  <rect class="render" x="178" y="364" width="210" height="100" rx="18"/>
  <text class="label" x="250" y="398">Commit</text>
  <text class="small" x="212" y="430">screen update finished</text>

  <rect class="effect" x="472" y="364" width="210" height="100" rx="18"/>
  <text class="label" x="536" y="398">Effect</text>
  <text class="small" x="508" y="430">runs after commit</text>

  <rect class="external" x="742" y="364" width="160" height="100" rx="18"/>
  <text class="label" x="780" y="398">External</text>
  <text class="small" x="774" y="430">DOM API · network</text>

  <path class="arrow" d="M782 244 C782 326 284 310 284 364"/>
  <path class="arrow" d="M388 414 H472"/>
  <path class="arrow" d="M682 414 H742"/>

  <rect class="warn" x="120" y="516" width="760" height="58" rx="16"/>
  <text class="label" x="306" y="548">No external system? You probably do not need an Effect.</text>
</svg>
