<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="되돌리기 3형제 선택 기준">
  <style>
    .q { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; rx: 10; }
    .ans-r { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.5; rx: 10; }
    .ans-s { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; rx: 10; }
    .ans-v { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; rx: 10; }
    .label { font: 600 13px sans-serif; fill: #334155; }
    .cmd { font: 600 13px monospace; fill: #0f172a; }
    .sub { font: 11px sans-serif; fill: #64748b; }
    .edge { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#m); }
    @media (prefers-color-scheme: dark) {
      .q { fill: #1e293b; stroke: #94a3b8; }
      .ans-r { fill: #134e4a; stroke: #5eead4; } .ans-s { fill: #451a03; stroke: #fbbf24; } .ans-v { fill: #2e1065; stroke: #c4b5fd; }
      .label { fill: #e2e8f0; } .cmd { fill: #f1f5f9; } .sub { fill: #94a3b8; } .edge { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="q" x="260" y="20" width="200" height="46" rx="10"/>
  <text class="label" x="360" y="48" text-anchor="middle">잘못을 커밋했는가?</text>

  <rect class="ans-r" x="60" y="140" width="180" height="72" rx="10"/>
  <text class="cmd" x="150" y="170" text-anchor="middle">git restore</text>
  <text class="sub" x="150" y="192" text-anchor="middle">파일 내용만 복원</text>

  <rect class="q" x="270" y="140" width="180" height="46" rx="10"/>
  <text class="label" x="360" y="168" text-anchor="middle">이미 공유(push)했는가?</text>

  <rect class="ans-s" x="250" y="240" width="180" height="72" rx="10"/>
  <text class="cmd" x="340" y="270" text-anchor="middle">git reset</text>
  <text class="sub" x="340" y="292" text-anchor="middle">로컬 이력 다시 쓰기</text>

  <rect class="ans-v" x="480" y="240" width="180" height="72" rx="10"/>
  <text class="cmd" x="570" y="270" text-anchor="middle">git revert</text>
  <text class="sub" x="570" y="292" text-anchor="middle">반대 커밋으로 취소</text>

  <path class="edge" d="M300 66 C 220 90, 170 110, 152 138"/>
  <text class="sub" x="200" y="100">아니오 (커밋 전)</text>
  <path class="edge" d="M380 66 L 372 138"/>
  <text class="sub" x="392" y="106">예</text>
  <path class="edge" d="M340 186 L 340 238"/>
  <text class="sub" x="300" y="216">아니오</text>
  <path class="edge" d="M450 172 C 530 190, 560 210, 570 238"/>
  <text class="sub" x="520" y="196">예</text>
</svg>
