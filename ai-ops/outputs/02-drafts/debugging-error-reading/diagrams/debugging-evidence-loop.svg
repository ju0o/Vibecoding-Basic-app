<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">Debugging Evidence Loop</title>
  <desc id="desc">A debugging loop that starts from an error message, checks source location and runtime state, narrows the cause, applies a fix, and verifies the result.</desc>
  <style>
    .bg { fill: #fbfcf7; }
    .box { fill: #fff; stroke: #6b8f3a; stroke-width: 2; rx: 16; }
    .label { fill: #203810; font: 700 19px system-ui, sans-serif; }
    .text { fill: #405a2a; font: 15px system-ui, sans-serif; }
    .arrow { stroke: #6b8f3a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #10150d; }
      .box { fill: #172313; stroke: #9acc68; }
      .label { fill: #e4f7c8; }
      .text { fill: #c5dfa7; }
      .arrow { stroke: #9acc68; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b8f3a" />
    </marker>
  </defs>
  <rect class="bg" width="960" height="380" />
  <rect class="box" x="70" y="55" width="190" height="85" />
  <text class="label" x="115" y="90">Error Message</text>
  <text class="text" x="105" y="116">type + message</text>
  <path class="arrow" d="M265 98 H370" />
  <rect class="box" x="380" y="55" width="190" height="85" />
  <text class="label" x="425" y="90">Location</text>
  <text class="text" x="415" y="116">file + line</text>
  <path class="arrow" d="M575 98 H680" />
  <rect class="box" x="690" y="55" width="190" height="85" />
  <text class="label" x="728" y="90">Runtime State</text>
  <text class="text" x="724" y="116">variables + stack</text>
  <path class="arrow" d="M785 145 V230" />
  <rect class="box" x="690" y="240" width="190" height="85" />
  <text class="label" x="735" y="276">Cause</text>
  <text class="text" x="720" y="302">narrowed hypothesis</text>
  <path class="arrow" d="M685 283 H580" />
  <rect class="box" x="380" y="240" width="190" height="85" />
  <text class="label" x="435" y="276">Fix</text>
  <text class="text" x="418" y="302">small change</text>
  <path class="arrow" d="M375 283 H270" />
  <rect class="box" x="70" y="240" width="190" height="85" />
  <text class="label" x="115" y="276">Verify</text>
  <text class="text" x="105" y="302">run + observe</text>
  <path class="arrow" d="M165 235 V145" />
</svg>
