<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">JSON Data Contract Flow</title>
  <desc id="desc">Flow from JavaScript value through JSON.stringify, HTTP body and Content-Type, JSON.parse, and contract checks.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .box { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    .wire { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
    .check { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
    .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
    .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .title { font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
    .label { font: 700 18px system-ui, -apple-system, Segoe UI, sans-serif; fill: #111827; }
    .small { font: 500 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
    .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="640"/>
  <rect class="panel" x="48" y="40" width="904" height="560" rx="24"/>
  <text class="title" x="82" y="84">JSON 데이터 계약은 문법, 전송, 의미 검증을 분리한다</text>

  <rect class="box" x="86" y="142" width="200" height="116" rx="18"/>
  <text class="label" x="124" y="178">JavaScript value</text>
  <text class="mono" x="112" y="210">{ completed: true }</text>
  <text class="small" x="118" y="236">runtime object</text>

  <rect class="wire" x="400" y="142" width="200" height="116" rx="18"/>
  <text class="label" x="440" y="178">JSON text</text>
  <text class="mono" x="432" y="210">{"completed":true}</text>
  <text class="small" x="436" y="236">network body</text>

  <rect class="box" x="714" y="142" width="200" height="116" rx="18"/>
  <text class="label" x="756" y="178">Parsed value</text>
  <text class="mono" x="742" y="210">response.json()</text>
  <text class="small" x="750" y="236">JavaScript value</text>

  <path class="arrow" d="M286 200 H400"/>
  <text class="small" x="314" y="188">JSON.stringify()</text>
  <path class="arrow" d="M600 200 H714"/>
  <text class="small" x="624" y="188">JSON.parse()</text>

  <rect class="wire" x="300" y="330" width="400" height="96" rx="18"/>
  <text class="label" x="376" y="366">HTTP Content-Type</text>
  <text class="mono" x="380" y="398">Content-Type: application/json</text>

  <path class="arrow" d="M500 258 V330"/>

  <rect class="check" x="132" y="488" width="300" height="76" rx="18"/>
  <text class="label" x="194" y="520">Contract check</text>
  <text class="small" x="168" y="548">field presence · type · optionality</text>

  <rect class="warn" x="568" y="488" width="300" height="76" rx="18"/>
  <text class="label" x="640" y="520">Common mistake</text>
  <text class="small" x="604" y="548">parse success ≠ contract success</text>

  <path class="arrow" d="M814 258 C814 360 282 380 282 488"/>
  <path class="arrow" d="M814 258 C884 364 718 404 718 488"/>
</svg>
